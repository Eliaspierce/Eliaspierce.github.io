<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a2e3d"/>
      <stop offset="100%" stop-color="#151821"/>
    </radialGradient>

    <!-- Metallic Camera Body Gradient -->
    <linearGradient id="metalBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#51596b"/>
      <stop offset="30%" stop-color="#3a3f4d"/>
      <stop offset="70%" stop-color="#242831"/>
      <stop offset="100%" stop-color="#1b1e26"/>
    </linearGradient>

    <!-- Camera Lens Outer Ring -->
    <linearGradient id="lensRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#868fa1"/>
      <stop offset="50%" stop-color="#4e5563"/>
      <stop offset="100%" stop-color="#292e38"/>
    </linearGradient>

    <!-- Camera Lens Glass Gradient -->
    <radialGradient id="lensGlass" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a3c40"/>
      <stop offset="50%" stop-color="#0b1d20"/>
      <stop offset="100%" stop-color="#050810"/>
    </radialGradient>

    <!-- Glass Flare Reflection -->
    <linearGradient id="flare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Toe / Skin Tone Gradient -->
    <linearGradient id="skinTone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffdfd3"/>
      <stop offset="60%" stop-color="#f0b9a2"/>
      <stop offset="100%" stop-color="#d8967a"/>
    </linearGradient>

    <!-- Toenail / Lens Cap Base Gradient -->
    <linearGradient id="toenailGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcedec"/>
      <stop offset="70%" stop-color="#f3cbca"/>
      <stop offset="100%" stop-color="#e2a3a1"/>
    </linearGradient>
    
    <!-- Toe Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Inner Shadow Effect for Lens Cutout -->
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="0" dy="5"/>
      <feGaussianBlur stdDeviation="7" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="black" flood-opacity="0.7" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <!-- GRID / TECH BACKGROUND LINES (Optional Aesthetic) -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="600" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="500" y1="0" x2="500" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
    <line x1="700" y1="0" x2="700" y2="600" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="500" x2="800" y2="500" />
  </g>

  <!-- MAIN SUTRUCTURE: THE TOENAIL CAMERA -->
  <g filter="url(#shadow)">
    
    <!-- MAIN CAMERA BODY (Styled slightly like a foot/toe silhouette) -->
    <path d="M 220,180 
             C 220,160 240,140 260,140 
             L 340,140 
             C 350,110 370,110 390,110 
             L 470,110 
             C 490,110 500,120 510,140
             L 540,140 
             C 560,140 580,160 580,180 
             L 580,420 
             C 580,460 540,490 480,490
             L 320,490
             C 260,490 220,460 220,420 
             Z" 
          fill="url(#metalBody)" stroke="#1b1e26" stroke-width="4" stroke-linejoin="round"/>

    <!-- CAMERA TOP CONTROLS & FLASH -->
    <!-- Shutter Button -->
    <rect x="260" y="115" width="50" height="25" rx="5" fill="#a4b0be" stroke="#2f3542" stroke-width="3"/>
    <rect x="270" y="110" width="30" height="8" rx="2" fill="#ced6e0"/>
    
    <!-- Mode Dial -->
    <rect x="495" y="120" width="45" height="20" rx="3" fill="#2f3542"/>
    <line x1="504" y1="120" x2="504" y2="140" stroke="#747d8c" stroke-width="2"/>
    <line x1="514" y1="120" x2="514" y2="140" stroke="#747d8c" stroke-width="2"/>
    <line x1="524" y1="120" x2="524" y2="140" stroke="#747d8c" stroke-width="2"/>
    <line x1="534" y1="120" x2="534" y2="140" stroke="#747d8c" stroke-width="2"/>

    <!-- Built-in Flash Window -->
    <rect x="260" y="170" width="70" height="30" rx="4" fill="#ebebeb" stroke="#242831" stroke-width="2"/>
    <rect x="265" y="175" width="60" height="20" rx="2" fill="#fff9db" opacity="0.9"/>
    
    <!-- Red Accent Line (Leica style, adding premium camera feel) -->
    <path d="M 222,220 L 578,220" stroke="#ff4757" stroke-width="4"/>

    <!-- ================= EMBEDDED TOE & TOENAIL LENS ASSEMBLY ================= -->
    
    <!-- Outer Lens Barrel / Base Ring -->
    <circle cx="400" cy="340" r="130" fill="url(#lensRing)" stroke="#111" stroke-width="4"/>
    <circle cx="400" cy="340" r="120" fill="#181a21"/>
    
    <!-- The Toe (Skin Layer inside the Lens Ring) -->
    <path d="M 290,380 
             C 290,270 330,230 400,230 
             C 470,230 510,270 510,380 
             C 510,440 470,450 400,450 
             C 330,450 290,440 290,380 Z" 
          fill="url(#skinTone)"/>
          
    <!-- Cuticles / Skin Fold Lines around Nail -->
    <path d="M 305,370 C 305,275 340,250 400,250 C 460,250 495,275 495,370" 
          fill="none" stroke="#be7a62" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

    <!-- THE TOENAIL (Functions as the Lens Cap / Aperture Shield Cover) -->
    <path d="M 312,365 
             C 312,275 345,260 400,260 
             C 455,260 488,275 488,365 
             C 488,390 470,400 400,400 
             C 330,400 312,390 312,365 Z" 
          fill="url(#toenailGrad)" stroke="#d39290" stroke-width="2"/>

    <!-- Toenail Free Edge (The white/creamy tip tip grows out) -->
    <path d="M 312,365 C 330,390 360,400 400,400 C 440,400 470,390 488,365 C 486,375 460,388 400,388 C 340,388 314,375 312,365 Z" 
          fill="#ffffff" opacity="0.75"/>
          
    <!-- Lunula (The white half-moon at base of nail) -->
    <path d="M 370,264 C 380,275 420,275 430,264 C 420,261 380,261 370,264 Z" 
          fill="#ffffff" opacity="0.5"/>

    <!-- ================= CAMERA LENS OPENING THROUGH THE TOENAIL ================= -->
    <!-- This core element fuses the two concepts together -->
    
    <!-- Lens Cutout Frame inside the nail -->
    <circle cx="400" cy="335" r="55" fill="#11141a" filter="url(#innerShadow)"/>
    <circle cx="400" cy="335" r="50" fill="url(#lensGlass)"/>
    
    <!-- Aperture Blades Details -->
    <g stroke="#11141a" stroke-width="1.5" opacity="0.4">
      <polygon points="400,285 435,300 415,335 385,310"/>
      <polygon points="450,335 435,370 400,350 415,315"/>
      <polygon points="400,385 365,370 385,335 415,360"/>
      <polygon points="350,335 365,300 400,320 385,355"/>
    </g>

    <!-- Camera Lens Core Sensor (The "Pupil") -->
    <circle cx="400" cy="335" r="22" fill="#020408"/>
    <circle cx="400" cy="335" r="10" fill="#0b2428"/>

    <!-- High-tech Lens Reflections / Gloss Glare -->
    <path d="M 360,315 A 45,45 0 0,1 440,295 L 430,305 A 35,35 0 0,0 370,325 Z" fill="url(#flare)"/>
    <circle cx="422" cy="312" r="5" fill="#ffffff" opacity="0.7"/>
    <circle cx="430" cy="322" r="2.5" fill="#ffffff" opacity="0.5"/>
    
    <!-- Soft Pinkish/Organic Reflection on the glass from the nail -->
    <ellipse cx="400" cy="375" rx="25" ry="8" fill="#f3cbca" opacity="0.25" filter="url(#innerShadow)"/>
    
  </g>
  
  <!-- TEXT OR LOGO BRANDING -->
  <text x="400" y="540" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#a4b0be" text-anchor="middle" letter-spacing="4">
    TOE<tspan fill="#ff4757">CAM</tspan> PRO
  </text>
  <text x="400" y="560" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="11" fill="#747d8c" text-anchor="middle" letter-spacing="1">
    1:1.4 ULTRA MACRO FUSION
  </text>
</svg>
