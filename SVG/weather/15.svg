<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background: #1a2b4c;">
  <defs>
    <g id="flake">
      <circle cx="0" cy="0" r="3" fill="#ffffff" opacity="0.8" />
    </g>
  </defs>
  <use href="#flake" x="0" y="0">
    <animateTransform 
      attributeName="transform" 
      type="translate" 
      values="-50,400; 850,200" 
      dur="2.5s" 
      repeatCount="indefinite" />
  </use>
  <use href="#flake" x="0" y="0">
    <animateTransform 
      attributeName="transform" 
      type="translate" 
      values="-50,250; 850,50" 
      dur="4s" 
      repeatCount="indefinite" 
      begin="1s" />
  </use>
  <use href="#flake" x="0" y="0">
    <animateTransform 
      attributeName="transform" 
      type="translate" 
      values="-50,450; 850,300" 
      dur="3.2s" 
      repeatCount="indefinite" 
      begin="0.5s" />
  </use>
  <use href="#flake" x="0" y="0">
    <animateTransform 
      attributeName="transform" 
      type="translate" 
      values="-50,150; 850,-50" 
      dur="1.8s" 
      repeatCount="indefinite" 
      begin="1.5s" />
  </use>
</svg>
