<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="100%" height="100%">
  <style>
    .drop {
      stroke: #4a90e2;
      stroke-width: 2;
      stroke-linecap: round;
      animation: fall 0.8s linear infinite;
    }
    .d1 { animation-delay: 0.2s; left: 40px; }
    .d2 { animation-delay: 0.5s; left: 80px; }
    .d3 { animation-delay: 0.1s; left: 120px; }
    .d4 { animation-delay: 0.7s; left: 160px; }
    @keyframes fall {
      0% {
        transform: translateY(-20px);
        opacity: 0;
      }
      50% {
        opacity: 1;
      }
      100% {
        transform: translateY(320px);
        opacity: 0;
      }
    }
  </style>
  <rect width="100%" height="100%" fill="#1a1a1a" />
  <g>
    <line class="drop d1" x1="40" y1="-20" x2="35" y2="10" />
    <line class="drop d2" x1="90" y1="-20" x2="85" y2="10" />
    <line class="drop d3" x1="130" y1="-20" x2="125" y2="10" />
    <line class="drop d4" x1="170" y1="-20" x2="165" y2="10" />
  </g>
</svg>
