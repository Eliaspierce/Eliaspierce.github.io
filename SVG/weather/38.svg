<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100" height="100">
  <defs>
    <style>
      .bolt {
        fill: #FFD700;
        opacity: 0;
        animation: flash 3s infinite;
      }
      .rain { stroke: #4A90E2; stroke-width: 2; stroke-linecap: round; animation: fall 1.2s linear infinite;}
      .cloud {fill: #90A4AE;}
      @keyframes flash {0%, 90%, 100% { opacity: 0; } 92% { opacity: 1; } 94% { opacity: 0; } 96% { opacity: 1; } 98% { opacity: 0; }}
      @keyframes fall {0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(10px); opacity: 0; }}
    </style>
  </defs>
  <path class="cloud" d="M19.5 30a9 9 0 0 1 17.5-2.8 7.5 7.5 0 0 1 11.5 6.8A7.5 7.5 0 0 1 41 42H19.5a7.5 7.5 0 0 1 0-12z"/>
  <line class="rain" x1="24" y1="45" x2="22" y2="50" style="animation-delay: 0s;" />
  <line class="rain" x1="32" y1="45" x2="30" y2="50" style="animation-delay: 0.4s;" />
  <line class="rain" x1="40" y1="45" x2="38" y2="50" style="animation-delay: 0.8s;" />
  <polygon class="bolt" points="32,36 27,46 33,46 30,56 40,43 33,43" />
</svg>
