<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" style="background:#222;">
  <circle cx="50" cy="150" r="3" fill="#d2b48c" opacity="0.8">
    <animate attributeName="cx" values="50; 550" dur="2s" repeatCount="indefinite" />
    <animate attributeName="cy" values="150; 120; 160" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0; 0.8; 0" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="20" cy="200" r="2" fill="#d2b48c" opacity="0.6">
    <animate attributeName="cx" values="20; 520" dur="1.5s" begin="0.5s" repeatCount="indefinite" />
    <animate attributeName="cy" values="200; 170; 210" dur="1.5s" begin="0.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0; 0.6; 0" dur="1.5s" begin="0.5s" repeatCount="indefinite" />
  </circle>
</svg>
