<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <style>
      .moon { fill: #f6d365; }
      .cloud { fill: #90a4ae; }
      .snowflake { fill: #e0f7fa; opacity: 0.8; animation: fall linear infinite; }
      @keyframes fall {
        0% { transform: translateY(-10px); }
        100% { transform: translateY(50px); }
      }
      .s1 { animation-duration: 2s; animation-delay: 0s; }
      .s2 { animation-duration: 2.5s; animation-delay: 0.7s; }
      .s3 { animation-duration: 1.8s; animation-delay: 0.3s; }
    </style>
  </defs>
  <rect width="64" height="64" rx="8" fill="#1e293b"/>
  <circle cx="20" cy="20" r="8" class="moon"/>
  <path d="M42 32h-1.5a6.5 6.5 0 0 0-12.5-2 5.5 5.5 0 0 0-5.5 5.5c0 3 2.5 5.5 5.5 5.5h14a4.5 4.5 0 0 0 0-9z" class="cloud"/>
  <circle cx="32" cy="42" r="1.2" class="snowflake s1"/>
  <circle cx="38" cy="40" r="1" class="snowflake s2"/>
  <circle cx="44" cy="44" r="1.5" class="snowflake s3"/>
</svg>
