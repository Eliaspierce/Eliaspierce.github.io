<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <style>
      .cloud {
        fill: #90A4AE;
        stroke: #37474F;
        stroke-width: 3;
        stroke-linejoin: round;
      }
      .freezing-rain {
        stroke: #00E5FF;
        stroke-width: 2.5;
        stroke-linecap: round;
        opacity: 0;
        animation: fall 1.2s linear infinite;
      }
      .drop-1 { animation-delay: 0s; }
      .drop-2 { animation-delay: 0.4s; }
      .drop-3 { animation-delay: 0.8s; }

      @keyframes fall {
        0% {
          transform: translateY(-10px);
          opacity: 0;
        }
        50% {
          opacity: 1;
        }
        100% {
          transform: translateY(20px);
          opacity: 0;
        }
      }
    </style>
  </defs>
  <path class="cloud" d="M30 60 h40 a12 12 0 0 0 0 -24 a15 15 0 0 0 -28 -5 a12 12 0 0 0 -12 17.5 a10 10 0 0 0 0 11.5 z" />
  <line class="freezing-rain drop-1" x1="38" y1="65" x2="34" y2="77" />
  <line class="freezing-rain drop-2" x1="50" y1="65" x2="46" y2="77" />
  <line class="freezing-rain drop-3" x1="62" y1="65" x2="58" y2="77" />
</svg>
