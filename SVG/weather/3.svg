<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <style>
      .cloud {
        fill: #4F5D73;
        animation: float 3s ease-in-out infinite;
      }
      .dark-cloud {
        fill: #2C3E50;
      }
      .lightning {
        fill: #F1C40F;
        opacity: 0;
        animation: flash 2s infinite;
      }
      .rain {
        stroke: #3498DB;
        stroke-width: 2;
        stroke-linecap: round;
        animation: fall 0.6s linear infinite;
      }
      .rain-delay {
        animation-delay: 0.3s;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes flash {
        0%, 90%, 96%, 100% { opacity: 0; }
        92%, 94% { opacity: 1; }
      }
      @keyframes fall {
        0% { transform: translateY(-8px); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: translateY(12px); opacity: 0; }
      }
    </style>
  </defs>
  <rect width="64" height="64" rx="10" fill="#1E272C"/>
  <line class="rain" x1="20" y1="40" x2="17" y2="48" />
  <line class="rain rain-delay" x1="28" y1="38" x2="25" y2="46" />
  <line class="rain" x1="36" y1="42" x2="33" y2="50" />
  <line class="rain rain-delay" x1="44" y1="39" x2="41" y2="47" />
  <path class="dark-cloud" d="M18 36a10 10 0 0 1 19-4 8 8 0 0 1 11 7 7 7 0 0 1-3 13H18a8 8 0 0 1 0-16z"/>
  <polygon class="lightning" points="32,26 26,40 33,40 29,54 40,37 32,37" />
  <path class="cloud" d="M22 38a9 9 0 0 1 17-3 7 7 0 0 1 10 6 6 6 0 0 1-2 11H22a7 7 0 0 1 0-14z"/>
</svg>
