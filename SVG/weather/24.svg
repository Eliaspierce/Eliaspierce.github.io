<svg viewBox="0 0 64 64" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .wind-line {
        stroke: #90A4AE;
        stroke-width: 3;
        stroke-linecap: round;
        opacity: 0;
        animation: blow 2s infinite linear;
      }
      .delay-1 { animation-delay: 0.6s; }
      .delay-2 { animation-delay: 1.2s; }
      @keyframes blow {
        0% {
          transform: translateX(-15px);
          opacity: 0;
        }
        50% {
          opacity: 1;
        }
        100% {
          transform: translateX(15px);
          opacity: 0;
        }
      }
    </style>
  </defs>
  <g fill="none">
    <path class="wind-line" d="M14 26 H38 C42 26 44 24 44 21 C44 18 41 16 37 16 C34 16 32 18 32 20" />
    <path class="wind-line delay-1" d="M10 38 H28 C32 38 34 36 34 34 C34 32 32 30 29 30 C27 30 26 31 26 32" />
    <path class="wind-line delay-2" d="M18 50 H46 C50 50 52 48 52 46 C52 44 49 42 45 42 C42 42 40 44 40 45" />
  </g>
</svg>
