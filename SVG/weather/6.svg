<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <style>
      .rain {
        stroke: #4facfe;
        stroke-width: 2;
        stroke-linecap: round;
        animation: fall 0.8s linear infinite;
      }
      .sleet {
        fill: #ffffff;
        stroke: #cbe6ff;
        stroke-width: 1;
        animation: fall 1.2s linear infinite;
      }
      .delay-1 { animation-delay: 0.2s; }
      .delay-2 { animation-delay: 0.4s; }
      .delay-3 { animation-delay: 0.6s; }

      @keyframes fall {
        0% {
          transform: translateY(-20px);
          opacity: 0;
        }
        50% {
          opacity: 1;
        }
        100% {
          transform: translateY(180px);
          opacity: 0;
        }
      }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#1a1a2e" rx="15"/>
  <line class="rain" x1="40" y1="20" x2="35" y2="40" />
  <line class="rain delay-1" x1="80" y1="10" x2="75" y2="30" />
  <line class="rain delay-2" x1="120" y1="15" x2="115" y2="35" />
  <line class="rain delay-3" x1="160" y1="5" x2="155" y2="25" />
  <circle class="sleet delay-1" cx="60" cy="20" r="2.5" />
  <circle class="sleet delay-3" cx="100" cy="15" r="2" />
  <circle class="sleet delay-2" cx="140" cy="25" r="3" />
  <circle class="sleet" cx="180" cy="10" r="2" />
</svg>
