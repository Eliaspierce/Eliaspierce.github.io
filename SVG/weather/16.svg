<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <style>
      .sky { fill: #0b1d3a; }
      .flake { fill: #ffffff; opacity: 0.8; }
    </style>
  </defs>
  <rect class="sky" width="400" height="400" />
  <circle class="flake" cx="50" cy="-10" r="3">
    <animateTransform attributeName="transform" type="translate" 
      values="0,0; 0,420" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle class="flake" cx="150" cy="-30" r="5">
    <animateTransform attributeName="transform" type="translate" 
      values="0,0; 0,440" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle class="flake" cx="280" cy="-20" r="2">
    <animateTransform attributeName="transform" type="translate" 
      values="0,0; 0,430" dur="3.5s" repeatCount="indefinite" />
  </circle>
  <circle class="flake" cx="350" cy="-50" r="4">
    <animateTransform attributeName="transform" type="translate" 
      values="0,0; 0,460" dur="5s" repeatCount="indefinite" />
  </circle>
</svg>
