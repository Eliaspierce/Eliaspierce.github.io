<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .raindrop { stroke: #4a90e2; stroke-width: 2; stroke-linecap: round; animation: fall 0.4s linear infinite;}
    .delay-1 { animation-delay: 0.1s; }
    .delay-2 { animation-delay: 0.2s; }
    .delay-3 { animation-delay: 0.3s; }
    @keyframes fall {0% { transform: translateY(-20px); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateY(180px); opacity: 0; }}
  </style>
  <rect width="100%" height="100%" fill="#1a1a1a"/>
  <line x1="30" y1="10" x2="20" y2="50" class="raindrop delay-1" />
  <line x1="60" y1="0" x2="50" y2="40" class="raindrop delay-2" />
  <line x1="90" y1="20" x2="80" y2="60" class="raindrop delay-3" />
  <line x1="120" y1="5" x2="110" y2="45" class="raindrop delay-1" />
  <line x1="150" y1="15" x2="140" y2="55" class="raindrop delay-2" />
  <line x1="180" y1="8" x2="170" y2="48" class="raindrop delay-3" />
  <line x1="45" y1="50" x2="35" y2="90" class="raindrop delay-3" />
  <line x1="75" y1="40" x2="65" y2="80" class="raindrop delay-1" />
  <line x1="105" y1="60" x2="95" y2="100" class="raindrop delay-2" />
  <line x1="135" y1="45" x2="125" y2="85" class="raindrop delay-3" />
  <line x1="165" y1="55" x2="155" y2="95" class="raindrop delay-1" />
</svg>
