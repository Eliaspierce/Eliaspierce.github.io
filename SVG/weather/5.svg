<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <style>
      .background { fill: #1a2536; }
      .cloud { fill: #5c6b80; }
      
      /* Rain animation */
      .raindrop {
        stroke: #4facfe;
        stroke-width: 2;
        stroke-linecap: round;
        animation: fall-rain 1s linear infinite;
      }
      
      /* Snow animation */
      .snowflake {
        fill: #ffffff;
        animation: fall-snow 3s ease-in-out infinite;
      }

      /* Delays and variations for realism */
      .r1 { animation-delay: 0.1s; animation-duration: 0.8s; }
      .r2 { animation-delay: 0.4s; animation-duration: 1.1s; }
      .s1 { animation-delay: 0.2s; animation-duration: 2.5s; }
      .s2 { animation-delay: 1.2s; animation-duration: 3.5s; }

      @keyframes fall-rain {
        0% { transform: translateY(-20px); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: translateY(280px); opacity: 0; }
      }

      @keyframes fall-snow {
        0% { transform: translateY(-20px) translateX(0px); opacity: 0; }
        50% { transform: translateY(130px) translateX(15px); opacity: 1; }
        100% { transform: translateY(280px) translateX(-15px); opacity: 0; }
      }
    </style>
  </defs>
  <rect class="background" width="400" height="400" rx="20"/>
  <path class="cloud" d="M140 160 a40 40 0 0 1 80 0 a30 30 0 0 1 30 30 a30 30 0 0 1 -30 30 h-80 a35 35 0 0 1 -35 -35 a35 35 0 0 1 35 -25 z"/>
  <g>
    <line class="raindrop r1" x1="150" y1="230" x2="145" y2="250" />
    <line class="raindrop r2" x1="180" y1="230" x2="175" y2="250" />
  </g>
  <g>
    <circle class="snowflake s1" cx="220" cy="230" r="3" />
    <circle class="snowflake s2" cx="250" cy="230" r="4" />
  </g>
</svg>
