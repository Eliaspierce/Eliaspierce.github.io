<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <style>
    .snowflake {
      fill: #FFFFFF;
      animation: fall linear infinite;
    }
    .cloud {
      fill: #7c8b9d;
    }
    @keyframes fall {
      0% {
        transform: translateY(-10px);
        opacity: 0;
      }
      50% {
        opacity: 1;
      }
      100% {
        transform: translateY(70px);
        opacity: 0;
      }
    }
    .sf1 { animation-duration: 1.5s; animation-delay: 0s; }
    .sf2 { animation-duration: 2s; animation-delay: 0.5s; }
    .sf3 { animation-duration: 1.2s; animation-delay: 1s; }
  </style>
  <rect width="100" height="100" rx="15" fill="#34495e"/>
  <path class="cloud" d="M30 45 a12 12 0 0 1 20 -10 a15 15 0 0 1 25 5 a10 10 0 0 1 -5 18 h-40 a12 12 0 0 1 0 -13 z"/>
  <circle class="snowflake sf1" cx="40" cy="55" r="2"/>
  <circle class="snowflake sf2" cx="55" cy="53" r="1.5"/>
  <circle class="snowflake sf3" cx="70" cy="56" r="2"/>
</svg>
