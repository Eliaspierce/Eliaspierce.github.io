<svg viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg" style="background: #112233;">
  <line x1="40" y1="-20" x2="35" y2="10" stroke="#aaccff" stroke-width="1.5" stroke-linecap="round">
    <animate attributeName="y1" values="-20;320" dur="0.9s" repeatCount="indefinite" />
    <animate attributeName="y2" values="10;350" dur="0.9s" repeatCount="indefinite" />
  </line>
  <line x1="120" y1="-40" x2="115" y2="-10" stroke="#aaccff" stroke-width="1.2" stroke-linecap="round">
    <animate attributeName="y1" values="-40;300" dur="0.7s" repeatCount="indefinite" />
    <animate attributeName="y2" values="-10;330" dur="0.7s" repeatCount="indefinite" />
  </line>
  <circle cx="80" cy="-10" r="2.5" fill="#ffffff">
    <animate attributeName="cy" values="-10;310" dur="3.2s" repeatCount="indefinite" />
    <animate attributeName="cx" values="80;95;65;80" dur="3.2s" repeatCount="indefinite" />
  </circle>
  <circle cx="160" cy="-25" r="3.5" fill="#ffffff">
    <animate attributeName="cy" values="-25;315" dur="4.1s" repeatCount="indefinite" />
    <animate attributeName="cx" values="160;140;175;160" dur="4.1s" repeatCount="indefinite" />
  </circle>
</svg>
