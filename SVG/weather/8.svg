    <animate attributeName="y2" values="-20;350" dur="0.9s" repeatCount="indefinite"/>
  </line>
  <line x1="160" y1="-10" x2="156" y2="18" stroke="#a0c4ff" stroke-width="2" stroke-linecap="round">
