<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" style="background: #0f172a;">
  <circle cx="100" cy="-20" r="4" fill="#ffffff" opacity="0.8">
    <animate attributeName="cy" values="-20;620" dur="4s" repeatCount="indefinite" />
    <animate attributeName="cx" values="100;130;70;100" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="300" cy="-40" r="6" fill="#ffffff" opacity="0.9">
    <animate attributeName="cy" values="-40;640" dur="6s" repeatCount="indefinite" />
    <animate attributeName="cx" values="300;250;350;300" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="500" cy="-10" r="3" fill="#ffffff" opacity="0.6">
    <animate attributeName="cy" values="-10;610" dur="3.5s" repeatCount="indefinite" />
    <animate attributeName="cx" values="500;520;480;500" dur="3.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="700" cy="-30" r="5" fill="#ffffff" opacity="0.7">
    <animate attributeName="cy" values="-30;630" dur="5s" repeatCount="indefinite" />
    <animate attributeName="cx" values="700;650;720;700" dur="5s" repeatCount="indefinite" />
  </circle>
</svg>
