<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <g id="flake">
      <circle cx="0" cy="0" r="1.5" fill="#fff"/>
    </g>
    <style>
      .snowflake {
        animation: fall 2s linear infinite;
      }
      .delay1 { animation-delay: 0.5s; }
      .delay2 { animation-delay: 1.2s; }
      @keyframes fall {
        0% { transform: translateY(0px); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: translateY(22px); opacity: 0; }
      }
    </style>
  </defs>
  <circle cx="24" cy="22" r="10" fill="#ffa726" opacity="0.9"/>
  <path d="M42 30h-2.5a8 8 0 0 0-14.5-3 7 7 0 0 0-11 4.5A6.5 6.5 0 0 0 16 42h26a5.5 5.5 0 0 0 0-11z" fill="#90a4ae"/>
  <use href="#flake" x="22" y="44" class="snowflake" />
  <use href="#flake" x="30" y="42" class="snowflake delay1" />
  <use href="#flake" x="36" y="45" class="snowflake delay2" />
</svg>
