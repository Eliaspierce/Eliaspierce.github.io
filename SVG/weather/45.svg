<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <path id="drop" d="M0,0 L0,4" stroke="#4a90e2" stroke-width="2" stroke-linecap="round" />
    <style>
      .cloud-move {
        animation: drift 4s ease-in-out infinite alternate;
      }
      .rain-1 {
        animation: fall 1.2s linear infinite;
      }
      .rain-2 {
        animation: fall 0.9s linear infinite 0.4s;
      }
      .rain-3 {
        animation: fall 1.1s linear infinite 0.8s;
      }
      @keyframes drift {
        0% { transform: translateX(-2px); }
        100% { transform: translateX(3px); }
      }
      @keyframes fall {
        0% { transform: translateY(0); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: translateY(14px); opacity: 0; }
      }
    </style>
  </defs>
  <circle cx="32" cy="32" r="30" fill="#0b192c" />
  <path d="M22 18 A 10 10 0 0 1 38 30 A 11 11 0 0 0 22 18 Z" fill="#f5d77f" />
  <g class="cloud-move">
    <path d="M20 40 h18 a6 6 0 0 0 0 -12 a8 8 0 0 0 -15 -2 a6 6 0 0 0 -3 14 z" fill="#b0c4de" />
    <use href="#drop" class="rain-1" x="24" y="42" />
    <use href="#drop" class="rain-2" x="29" y="42" />
    <use href="#drop" class="rain-3" x="34" y="42" />
  </g>
</svg>
