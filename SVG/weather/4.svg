  <polygon class="lightning" points="32,36 26,46 31,46 29,54 38,42 33,42"/>
  <rect class="rain" x="22" y="42" width="2" height="6" rx="1"/>
  <rect class="rain r2" x="28" y="42" width="2" height="6" rx="1"/>
  <rect class="rain" x="34" y="42" width="2" height="6" rx="1"/>
</svg>
