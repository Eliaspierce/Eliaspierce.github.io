<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100" height="100">
  <defs>
    <style>
      .cloud { fill: #90A4AE; }
      .rain { fill: #4FC3F7; opacity: 0.8; animation: fall 1s linear infinite; }
      .r2 { animation-delay: 0.4s; }
      .lightning { fill: #FFCA28; opacity: 0; animation: flash 2.5s steps(1) infinite; }
      
      @keyframes fall {
        0% { transform: translateY(0); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: translateY(12px); opacity: 0; }
      }
      
      @keyframes flash {
        0%, 90%, 94%, 100% { opacity: 0; }
        92%, 96% { opacity: 1; }
      }
    </style>
  </defs>
