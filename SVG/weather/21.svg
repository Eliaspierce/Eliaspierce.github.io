<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Soft blur filter for atmospheric fog effect -->
    <filter id="fog-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" />
    </filter>
  </defs>
  
  <g fill="none" stroke="#90A4AE" stroke-linecap="round" stroke-width="4" filter="url(#fog-blur)">
    <!-- Top fog bank -->
    <path d="M16 22h24c3.3 0 6-2.7 6-6s-2.7-6-6-6-6 2.7-6 6" />
    
    <!-- Middle main long fog streak -->
    <path d="M12 32h36c4.4 0 8-3.6 8-8s-3.6-8-8-8-8 3.6-8 8" />
    
    <!-- Lower wide fog lines -->
    <path d="M10 42h44" />
    <path d="M18 50h28" />
  </g>
</svg>
