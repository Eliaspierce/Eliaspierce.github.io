<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <style>
      @keyframes flash {
        0%, 90%, 94%, 100% { opacity: 0; }
        92%, 96% { opacity: 1; }
      }
      @keyframes fall {
        0% { transform: translateY(-4px); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: translateY(8px); opacity: 0; }
      }
      .moon { fill: #f1f5f9; }
      .cloud { fill: #475569; }
      .lightning { fill: #facc15; animation: flash 3s infinite; }
      .rain { stroke: #38bdf8; stroke-width: 2; stroke-linecap: round; animation: fall 1.2s infinite linear; }
      .rain-delay { animation-delay: 0.4s; }
    </style>
    <linearGradient id="nightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#nightGrad)" />
  <circle cx="20" cy="18" r="6" class="moon" />
  <circle cx="42" cy="14" r="1" fill="#cbd5e1" opacity="0.6" />
  <circle cx="12" cy="32" r="0.8" fill="#cbd5e1" opacity="0.8" />
  <polygon points="30,34 24,44 29,44 27,52 36,40 31,40" class="lightning" />
  <path d="M42 38h-2.13A7 7 0 0 0 26 35a7 7 0 0 0-5.87 5.92A5.5 5.5 0 0 0 15.5 46.5 5.5 5.5 0 0 0 21 52h21a5.5 5.5 0 0 0 5.5-5.5 5.5 5.5 0 0 0-5.5-5.5z" class="cloud" />
  <line x1="24" y1="54" x2="22" y2="58" class="rain" />
  <line x1="32" y1="54" x2="30" y2="58" class="rain rain-delay" />
  <line x1="40" y1="54" x2="38" y2="58" class="rain" />
</svg>
