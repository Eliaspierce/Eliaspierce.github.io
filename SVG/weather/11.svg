<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <style>
      .cloud { fill: #708090; }
      .raindrop {
        stroke: #4fa1c7;
        stroke-width: 2;
        stroke-linecap: round;
        animation: fall 0.8s linear infinite;
      }
      .drop1 { animation-delay: 0.1s; left: 10px; }
      .drop2 { animation-delay: 0.4s; }
      .drop3 { animation-delay: 0.2s; }
      .drop4 { animation-delay: 0.6s; }
      .drop5 { animation-delay: 0.3s; }

      @keyframes fall {
        0% {
          transform: translateY(0);
          opacity: 0;
        }
        50% {
          opacity: 1;
        }
        100% {
          transform: translateY(60px);
          opacity: 0;
        }
      }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#1e1e1e" rx="15"/>
  <path class="cloud" d="M60 90 a20 20 0 0 1 35 -15 a25 25 0 0 1 45 10 a20 20 0 0 1 -10 35 h-70 a20 20 0 0 1 0 -30 z"/>
  <g transform="translate(0, 10)">
    <line class="raindrop drop1" x1="75" y1="110" x2="75" y2="125" />
    <line class="raindrop drop2" x1="90" y1="105" x2="90" y2="120" />
    <line class="raindrop drop3" x1="105" y1="115" x2="105" y2="130" />
    <line class="raindrop drop4" x1="120" y1="105" x2="120" y2="120" />
    <line class="raindrop drop5" x1="135" y1="110" x2="135" y2="125" />
  </g>
</svg>
