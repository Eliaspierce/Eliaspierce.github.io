<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Cloud Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Snowflake Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Wind Line Blur -->
    <filter id="motionBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1 0" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="30" fill="url(#skyGrad)" />

  <!-- BLIZZARD BACKGROUND ANIMATION (Snow & Wind) -->
  <!-- Fast, angled wind lines -->
  <g stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" filter="url(#motionBlur)">
    <line x1="350" y1="50" x2="50" y2="200" stroke-dasharray="100 150" stroke-dashoffset="40" />
    <line x1="400" y1="120" x2="0" y2="320" stroke-dasharray="180 120" stroke-dashoffset="120" />
    <line x1="380" y1="20" x2="-20" y2="220" stroke-dasharray="150 200" stroke-dashoffset="80" />
  </g>

  <!-- Background Small Snowflakes -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="80" cy="120" r="2.5" />
    <circle cx="280" cy="90" r="1.5" />
    <circle cx="340" cy="160" r="2" />
    <circle cx="150" cy="220" r="3" />
    <circle cx="50" cy="260" r="1.5" />
    <circle cx="220" cy="250" r="2.5" />
  </g>

  <!-- WEATHER ICON: Heavy Blizzard Clouds -->
  <g transform="translate(10, -10)">
    <!-- Back Cloud -->
    <path d="M160 160 a35 35 0 0 1 60 -15 a45 45 0 0 1 75 15 a35 35 0 0 1 0 70 l-135 0 a35 35 0 0 1 0 -70 z" fill="url(#cloudGrad)" opacity="0.7" transform="translate(-20, -15) scale(0.9)" />
    
    <!-- Front Main Cloud -->
    <path d="M140 170 a45 45 0 0 1 80 -20 a55 55 0 0 1 90 20 a45 45 0 0 1 0 90 l-170 0 a45 45 0 0 1 0 -90 z" fill="url(#cloudGrad)" />
  </g>

  <!-- Foreground Detailed Snowflakes (Falling at an angle) -->
  <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" filter="url(#glow)" opacity="0.9">
    <!-- Snowflake 1 (Left) -->
    <g transform="translate(110, 240) scale(0.8)">
      <line x1="0" y1="-15" x2="0" y2="15" />
      <line x1="-13" y1="-7.5" x2="13" y2="7.5" />
      <line x1="-13" y1="7.5" x2="13" y2="-7.5" />
      <circle cx="0" cy="0" r="3" fill="#ffffff" />
    </g>
    
    <!-- Snowflake 2 (Right) -->
    <g transform="translate(270, 210) scale(1.1)">
      <line x1="0" y1="-15" x2="0" y2="15" />
      <line x1="-13" y1="-7.5" x2="13" y2="7.5" />
      <line x1="-13" y1="7.5" x2="13" y2="-7.5" />
      <circle cx="0" cy="0" r="3" fill="#ffffff" />
    </g>
  </g>

  <!-- TYPOGRAPHY / TEXT SECTION -->
  <!-- Main Weather Condition -->
  <text x="200" y="325" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="28" 
        font-weight="800" 
        fill="#f8fafc" 
        text-anchor="middle" 
        letter-spacing="1">
    BLIZZARD
  </text>

  <!-- Probability Chance Text -->
  <text x="200" y="355" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="16" 
        font-weight="600" 
        fill="#38bdf8" 
        text-anchor="middle" 
        letter-spacing="0.5">
    70% CHANCE OF SNOW
  </text>
</svg>
