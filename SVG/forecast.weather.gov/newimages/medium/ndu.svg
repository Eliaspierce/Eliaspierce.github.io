<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a3b2c" />
      <stop offset="40%" stop-color="#6e563f" />
      <stop offset="70%" stop-color="#ba956c" />
      <stop offset="100%" stop-color="#dfbe95" />
    </linearGradient>

    <!-- Base Desert/Ground Gradient -->
    <linearGradient id="duneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a67c52" />
      <stop offset="50%" stop-color="#c69d6d" />
      <stop offset="100%" stop-color="#845e38" />
    </linearGradient>

    <!-- Sandstorm Dust Cloud Gradient -->
    <linearGradient id="dustGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dfbe95" stop-opacity="0.3" />
      <stop offset="30%" stop-color="#c69d6d" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#9c7850" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6e563f" stop-opacity="0.9" />
    </linearGradient>

    <!-- Soft Glow Filter for Dust Atmosphere -->
    <filter id="dustGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Heavy Blur for Billowing Sand Storm Front -->
    <filter id="stormBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="25" />
    </filter>
  </defs>

  <!-- Background Sky -->
  <rect width="800" height="500" fill="url(#skyGrad)" />

  <!-- Hidden/Ominous Sun Sunken in Dust -->
  <circle cx="550" cy="180" r="45" fill="#fffdf0" opacity="0.25" filter="url(#dustGlow)" />

  <!-- Distant Desert Dunes (Slowly getting swallowed) -->
  <path d="M0,380 Q250,320 500,390 T800,350 L800,500 L0,500 Z" fill="url(#duneGrad)" opacity="0.7" />
  <path d="M0,420 Q180,380 400,440 T800,410 L800,500 L0,500 Z" fill="#845e38" opacity="0.9" />

  <!-- The Sandstorm: Layer 1 (Deep Background Billows) -->
  <g filter="url(#stormBlur)" opacity="0.6">
    <circle cx="100" cy="250" r="180" fill="#6e563f" />
    <circle cx="280" cy="200" r="160" fill="#9c7850" />
    <circle cx="450" cy="280" r="190" fill="#845e38" />
    <circle cx="650" cy="220" r="150" fill="#5c4734" />
  </g>

  <!-- The Sandstorm: Layer 2 (Main Swirling Storm Wall) -->
  <g filter="url(#stormBlur)" opacity="0.85">
    <!-- Massive sloping wall of advancing sand from the left/top-left -->
    <path d="M-100,-100 
             C 100,50 200,0 350,120 
             C 450,200 300,350 500,420 
             C 600,470 700,400 900,520 
             L-100,520 Z" fill="url(#dustGrad)" />
    
    <!-- Turbulent roll clouds within the storm -->
    <ellipse cx="200" cy="120" rx="180" ry="120" fill="#845e38" transform="rotate(-15, 200, 120)" />
    <ellipse cx="380" cy="300" rx="220" ry="140" fill="#6e563f" transform="rotate(-25, 380, 300)" />
  </g>

  <!-- Whipping Wind & Sand Streaks (Dynamic motion lines) -->
  <g stroke="url(#dustGrad)" stroke-linecap="round" opacity="0.65">
    <!-- High speed low-angle ground streaks -->
    <path d="M -50,450 L 450,380 M 200,480 L 750,410" stroke-width="8" stroke-dasharray="150 80" />
    <path d="M 50,420 L 600,330 M -20,390 L 500,310" stroke-width="5" stroke-dasharray="200 100" />
    
    <!-- Higher mid-air swirling blast lines -->
    <path d="M -10,220 C 150,180 300,280 550,200" stroke-width="4" fill="none" stroke-dasharray="120 60" />
    <path d="M 100,130 C 300,90 450,220 750,110" stroke-width="3" fill="none" stroke-dasharray="180 90" />
    <path d="M 250,50 C 400,20 600,120 850,30" stroke-width="2" fill="none" stroke-dasharray="90 40" />
  </g>

  <!-- Foreground Dense Dust Veil (Brings everything together into the fog of the storm) -->
  <rect width="800" height="500" fill="#ba956c" opacity="0.25" style="mix-blend-mode: multiply;" />
  <rect width="800" height="500" fill="#dfbe95" opacity="0.15" style="mix-blend-mode: screen;" />

  <!-- Tiny airborne debris / coarse sand particles close to viewer -->
  <g fill="#5c4734" opacity="0.7">
    <polygon points="120,400 125,398 123,403" />
    <polygon points="340,320 346,319 342,324" />
    <polygon points="560,450 564,447 562,452" />
    <polygon points="210,250 214,249 211,253" />
    <polygon points="680,360 685,359 681,364" />
  </g>
</svg>