<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Sky Background Gradient -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c102b" />
      <stop offset="100%" stop-color="#1d2557" />
    </linearGradient>

    <!-- Moon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Moon Gradient -->
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fefcd7" />
      <stop offset="100%" stop-color="#e2c974" />
    </linearGradient>

    <!-- Cloud Gradients -->
    <linearGradient id="backCloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#434e6b" />
      <stop offset="100%" stop-color="#20293a" />
    </linearGradient>

    <linearGradient id="frontCloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#516185" />
      <stop offset="100%" stop-color="#2c374e" />
    </linearGradient>

    <!-- Rain Drop Gradient -->
    <linearGradient id="rainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#76a0d0" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4a71a0" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="32" fill="url(#nightSky)" />

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="80" cy="100" r="1.5" />
    <circle cx="420" cy="80" r="2" opacity="0.8" />
    <circle cx="450" cy="180" r="1" />
    <circle cx="120" cy="220" r="1.5" />
    <circle cx="280" cy="60" r="2.5" opacity="0.4" />
    <circle cx="330" cy="130" r="1" />
  </g>

  <!-- Weather Icon Group (Centered) -->
  <g transform="translate(0, -20)">
    
    <!-- Moon (Night element) -->
    <path d="M 285 110 A 65 65 0 1 0 375 200 A 50 50 0 1 1 285 110 Z" 
          fill="url(#moonGrad)" 
          filter="url(#glow)" />

    <!-- Heavy Showers / Rain Drops (High Probability Backdrop) -->
    <g stroke="url(#rainGrad)" stroke-width="4" stroke-linecap="round">
      <!-- Row 1 -->
      <line x1="180" y1="330" x2="165" y2="370" />
      <line x1="220" y1="330" x2="205" y2="370" />
      <line x1="260" y1="330" x2="245" y2="370" />
      <line x1="300" y1="330" x2="285" y2="370" />
      <line x1="340" y1="330" x2="325" y2="370" />
      
      <!-- Row 2 -->
      <line x1="160" y1="380" x2="145" y2="420" />
      <line x1="200" y1="380" x2="185" y2="420" />
      <line x1="240" y1="380" x2="225" y2="420" />
      <line x1="280" y1="380" x2="265" y2="420" />
      <line x1="320" y1="380" x2="305" y2="420" />
    </g>

    <!-- Back Cloud -->
    <path d="M 200 260 
             A 35 35 0 0 1 250 220 
             A 45 45 0 0 1 325 210 
             A 40 40 0 0 1 360 270 
             A 35 35 0 0 1 340 330 
             L 200 330 Z" 
          fill="url(#backCloud)" />

    <!-- Front Cloud -->
    <path d="M 160 320 
             A 35 35 0 0 1 180 260 
             A 45 45 0 0 1 250 230 
             A 50 50 0 0 1 320 270 
             A 40 40 0 0 1 310 330 
             L 160 330 Z" 
          fill="url(#frontCloud)" />
  </g>

  <!-- Typography / Text Elements -->
  <text x="256" y="440" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="24px" 
        font-weight="600" 
        fill="#ffffff" 
        letter-spacing="1">
    SHOWERS NIGHT
  </text>

  <text x="256" y="475" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="18px" 
        font-weight="400" 
        fill="#a0aec0" 
        letter-spacing="0.5">
    Chances Rain 20%
  </text>
</svg>