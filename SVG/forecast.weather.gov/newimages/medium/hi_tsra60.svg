<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions for gradients and reusable elements -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1c2e"/>
      <stop offset="100%" stop-color="#0c0d14"/>
    </linearGradient>

    <!-- Cloud Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a889b"/>
      <stop offset="50%" stop-color="#4a5568"/>
      <stop offset="100%" stop-color="#2d3748"/>
    </linearGradient>

    <!-- Lightning Glow -->
    <filter id="lightningGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Raindrop Template -->
    <path id="drop" d="M0 0 C 2 3, 4 6, 4 9 C 4 11, 2 13, 0 13 C -2 13, -4 11, -4 9 C -4 6, -2 3, 0 0 Z" fill="#4ea5d9" opacity="0.7" />
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="32" fill="url(#bgGrad)"/>

  <!-- WEATHER ICON GRAPHIC -->
  <g transform="translate(0, -20)">
    <!-- Raindrops (Angled for wind effect) -->
    <g transform="translate(0, 0)">
      <use href="#drop" x="180" y="290" transform="rotate(15 180 290) scale(0.9)"/>
      <use href="#drop" x="220" y="310" transform="rotate(15 220 310) scale(1.1)"/>
      <use href="#drop" x="260" y="295" transform="rotate(15 260 295) scale(1)"/>
      <use href="#drop" x="300" y="315" transform="rotate(15 300 315) scale(0.9)"/>
      <use href="#drop" x="340" y="290" transform="rotate(15 340 290) scale(1.2)"/>
    </g>

    <!-- Lightning Bolt -->
    <path d="M 270 170 L 210 270 L 260 270 L 230 360 L 320 240 L 270 240 Z" 
          fill="#ffdf00" 
          filter="url(#lightningGlow)" />

    <!-- Main Thundercloud -->
    <path d="M 160 260 
             A 45 45 0 0 1 180 172 
             A 65 65 0 0 1 310 150 
             A 50 50 0 0 1 370 210 
             A 45 45 0 0 1 360 260 
             Z" 
          fill="url(#cloudGrad)"/>
  </g>

  <!-- WEATHER INFORMATION TEXT -->
  <!-- Main Condition -->
  <text x="256" y="375" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="32" 
        font-weight="bold" 
        fill="#ffffff" 
        text-anchor="middle" 
        letter-spacing="1">
    THUNDERSTORM
  </text>

  <!-- Chance of Rain Details -->
  <text x="256" y="420" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="20" 
        font-weight="600" 
        fill="#4ea5d9" 
        text-anchor="middle">
    LIKELY
  </text>

  <!-- Location / Proximity Alert -->
  <text x="256" y="455" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="16" 
        font-weight="500" 
        fill="#a0aec0" 
        text-anchor="middle">
    60%
  </text>
</svg>