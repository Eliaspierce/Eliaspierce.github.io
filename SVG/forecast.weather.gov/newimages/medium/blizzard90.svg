<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Dark, stormy blizzard sky -->
    <linearGradient id="blizzardSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Glowing effect for the text -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Soft radial mask to create depth and wind streaks in the blizzard -->
    <radialGradient id="windSwirl" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="800" height="600" fill="url(#blizzardSky)" />

  <!-- Wind & Fog Strips (Blizzard atmosphere) -->
  <path d="M-100,100 Q 200,150 500,50 T 900,120" fill="none" stroke="url(#windSwirl)" stroke-width="80" opacity="0.6" />
  <path d="M-100,300 Q 300,200 600,350 T 900,250" fill="none" stroke="url(#windSwirl)" stroke-width="120" opacity="0.4" />
  <path d="M-100,450 Q 200,500 400,400 T 900,520" fill="none" stroke="url(#windSwirl)" stroke-width="90" opacity="0.5" />

  <!-- Heavy Snow Layer 1: Background / Small / Fast (Slanted heavily to the right for high wind) -->
  <g fill="#ffffff" opacity="0.4">
    <circle cx="20" cy="40" r="1.5" /><circle cx="70" cy="15" r="1" /><circle cx="120" cy="80" r="2" />
    <circle cx="180" cy="35" r="1.5" /><circle cx="230" cy="90" r="1" /><circle cx="290" cy="10" r="2.5" />
    <circle cx="340" cy="65" r="1.5" /><circle cx="400" cy="30" r="1" /><circle cx="450" cy="85" r="2" />
    <circle cx="510" cy="40" r="1.5" /><circle cx="560" cy="15" r="1" /><circle cx="620" cy="75" r="2.5" />
    <circle cx="680" cy="45" r="1" /><circle cx="730" cy="95" r="2" /><circle cx="780" cy="20" r="1.5" />
    
    <circle cx="40" cy="140" r="2" /><circle cx="90" cy="115" r="1" /><circle cx="150" cy="180" r="1.5" />
    <circle cx="210" cy="135" r="2.5" /><circle cx="260" cy="190" r="1" /><circle cx="310" cy="110" r="2" />
    <circle cx="370" cy="165" r="1" /><circle cx="420" cy="130" r="1.5" /><circle cx="480" cy="185" r="2.5" />
    <circle cx="530" cy="140" r="1" /><circle cx="590" cy="115" r="2" /><circle cx="640" cy="175" r="1.5" />
    <circle cx="700" cy="145" r="2" /><circle cx="750" cy="195" r="1" /><circle cx="795" cy="120" r="2.5" />

    <circle cx="30" cy="240" r="1" /><circle cx="85" cy="215" r="2" /><circle cx="135" cy="280" r="1.5" />
    <circle cx="195" cy="235" r="2" /><circle cx="245" cy="290" r="1" /><circle cx="305" cy="210" r="2.5" />
    <circle cx="355" cy="265" r="1.5" /><circle cx="415" cy="230" r="2" /><circle cx="465" cy="285" r="1" />
    <circle cx="525" cy="240" r="2.5" /><circle cx="575" cy="215" r="1.5" /><circle cx="635" cy="275" r="2" />
    <circle cx="685" cy="245" r="1" /><circle cx="745" cy="295" r="2.5" /><circle cx="785" cy="220" r="1.5" />

    <circle cx="50" cy="340" r="2" /><circle cx="100" cy="315" r="1" /><circle cx="160" cy="380" r="2.5" />
    <circle cx="220" cy="335" r="1.5" /><circle cx="270" cy="390" r="2" /><circle cx="320" cy="310" r="1" />
    <circle cx="380" cy="365" r="2.5" /><circle cx="430" cy="330" r="1.5" /><circle cx="490" cy="385" r="2" />
    <circle cx="540" cy="340" r="1" /><circle cx="600" cy="315" r="2.5" /><circle cx="650" cy="375" r="1.5" />
    <circle cx="710" cy="345" r="2" /><circle cx="760" cy="395" r="1" /><circle cx="800" cy="330" r="2" />
  </g>

  <!-- Heavy Snow Layer 2: Midground / Slanted Wind Streaks -->
  <g stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
    <line x1="50" y1="50" x2="80" y2="70" /><line x1="150" y1="30" x2="180" y2="50" />
    <line x1="250" y1="70" x2="280" y2="90" /><line x1="350" y1="20" x2="380" y2="40" />
    <line x1="450" y1="60" x2="480" y2="80" /><line x1="550" y1="40" x2="580" y2="60" />
    <line x1="650" y1="80" x2="680" y2="100" /><line x1="750" y1="30" x2="780" y2="50" />

    <line x1="20" y1="150" x2="50" y2="170" /><line x1="120" y1="120" x2="150" y2="140" />
    <line x1="220" y1="180" x2="250" y2="200" /><line x1="320" y1="130" x2="350" y2="150" />
    <line x1="420" y1="170" x2="450" y2="190" /><line x1="520" y1="110" x2="550" y2="130" />
    <line x1="620" y1="190" x2="650" y2="210" /><line x1="720" y1="140" x2="750" y2="160" />

    <line x1="70" y1="250" x2="100" y2="270" /><line x1="170" y1="220" x2="200" y2="240" />
    <line x1="270" y1="280" x2="300" y2="300" /><line x1="370" y1="230" x2="400" y2="250" />
    <line x1="470" y1="270" x2="500" y2="290" /><line x1="570" y1="220" x2="600" y2="240" />
    <line x1="670" y1="290" x2="700" y2="310" /><line x1="770" y1="240" x2="800" y2="260" />

    <line x1="40" y1="350" x2="70" y2="370" /><line x1="140" y1="320" x2="170" y2="340" />
    <line x1="240" y1="380" x2="270" y2="400" /><line x1="340" y1="330" x2="370" y2="350" />
    <line x1="440" y1="370" x2="470" y2="390" /><line x1="540" y1="320" x2="570" y2="340" />
    <line x1="640" y1="390" x2="670" y2="410" /><line x1="740" y1="340" x2="770" y2="360" />
  </g>

  <!-- Weather Text: Yellow, High Contrast, Centered -->
  <g id="weatherText" fill="#fde047" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" text-anchor="middle" filter="url(#glow)">
    <text x="400" y="250" font-size="72" letter-spacing="2">BLIZZARD</text>
    <text x="400" y="330" font-size="28" fill="#fef08a" font-weight="700" letter-spacing="6">SEVERE WEATHER WARNING</text>
  </g>

  <!-- Heavy Snow Layer 3: Foreground / Large / 90% Screen Coverage (Covers the text) -->
  <g fill="#ffffff" opacity="0.85">
    <!-- Row 1 -->
    <circle cx="35" cy="85" r="4.5" /><circle cx="95" cy="55" r="3.5" /><circle cx="165" cy="95" r="5" />
    <circle cx="225" cy="45" r="4" /><circle cx="315" cy="75" r="5.5" /><circle cx="385" cy="35" r="3" />
    <circle cx="465" cy="85" r="4.5" /><circle cx="525" cy="55" r="3.5" /><circle cx="605" cy="95" r="5" />
    <circle cx="695" cy="45" r="4" /><circle cx="765" cy="75" r="5.5" />
    
    <!-- Row 2 (Directly over text area) -->
    <circle cx="15" cy="185" r="3.5" /><circle cx="105" cy="225" r="5" /><circle cx="195" cy="155" r="4" />
    <circle cx="285" cy="195" r="4.5" /><circle cx="355" cy="235" r="3.5" /><circle cx="435" cy="165" r="5.5" />
    <circle cx="515" cy="205" r="4" /><circle cx="585" cy="145" r="4.5" /><circle cx="675" cy="225" r="3" />
    <circle cx="755" cy="175" r="5" />

    <!-- Row 3 (Directly over text area) -->
    <circle cx="55" cy="315" r="5" /><circle cx="135" cy="285" r="3.5" /><circle cx="215" cy="345" r="4.5" />
    <circle cx="295" cy="305" r="4" /><circle cx="375" cy="355" r="5.5" /><circle cx="465" cy="295" r="3.5" />
    <circle cx="545" cy="335" r="4.5" /><circle cx="625" cy="305" r="5" /><circle cx="705" cy="355" r="4" />
    <circle cx="785" cy="285" r="3.5" />

    <!-- Row 4 -->
    <circle cx="25" cy="445" r="4" /><circle cx="115" cy="485" r="5.5" /><circle cx="185" cy="425" r="3" />
    <circle cx="265" cy="465" r="4.5" /><circle cx="345" cy="435" r="3.5" /><circle cx="425" cy="495" r="5" />
    <circle cx="505" cy="455" r="4" /><circle cx="575" cy="415" r="4.5" /><circle cx="665" cy="475" r="3.5" />
    <circle cx="745" cy="435" r="5" />

    <!-- Row 5 -->
    <circle cx="65" cy="545" r="5.5" /><circle cx="145" cy="515" r="3.5" /><circle cx="235" cy="565" r="4.5" />
    <circle cx="305" cy="535" r="4" /><circle cx="395" cy="575" r="5" /><circle cx="475" cy="525" r="3" />
    <circle cx="555" cy="555" r="4.5" /><circle cx="635" cy="515" r="4" /><circle cx="715" cy="585" r="5.5" />
    <circle cx="795" cy="535" r="3.5" />
  </g>

  <!-- Ground snow accumulation -->
  <path d="M 0,550 Q 200,530 400,560 T 800,540 L 800,600 L 0,600 Z" fill="#e2e8f0" opacity="0.9" />
  <path d="M 0,570 Q 150,550 450,580 T 800,560 L 800,600 L 0,600 Z" fill="#ffffff" />
</svg>