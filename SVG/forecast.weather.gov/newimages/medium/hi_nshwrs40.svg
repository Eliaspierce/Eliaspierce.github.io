<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Night Sky Gradient -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1445" />
      <stop offset="100%" stop-color="#1a265a" />
    </linearGradient>

    <!-- Moon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Cloud Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a5568" />
      <stop offset="100%" stop-color="#2d3748" />
    </linearGradient>

    <!-- Rain Drop Gradient -->
    <linearGradient id="rainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a0aec0" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#63b3ed" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#nightSky)" rx="32" />

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="100" cy="120" r="2" />
    <circle cx="420" cy="150" r="1.5" />
    <circle cx="250" cy="80" r="2" />
    <circle cx="400" cy="80" r="1" />
    <circle cx="120" cy="220" r="1" />
  </g>

  <!-- Crescent Moon -->
  <path d="M 340 100 A 45 45 0 1 0 385 210 A 55 55 0 1 1 340 100 Z" 
        fill="#f6e05e" 
        filter="url(#glow)" 
        opacity="0.9" />

  <!-- Rain Showers (Heavy/High Probability Grouping) -->
  <g stroke="url(#rainGrad)" stroke-width="4" stroke-linecap="round">
    <!-- Row 1 -->
    <line x1="180" y1="310" x2="165" y2="350" />
    <line x1="230" y1="310" x2="215" y2="350" />
    <line x1="280" y1="310" x2="265" y2="350" />
    <line x1="330" y1="310" x2="315" y2="350" />
    
    <!-- Row 2 -->
    <line x1="155" y1="365" x2="140" y2="405" />
    <line x1="205" y1="365" x2="190" y2="405" />
    <line x1="255" y1="365" x2="240" y2="405" />
    <line x1="305" y1="365" x2="290" y2="405" />
  </g>

  <!-- Heavy Weather Cloud -->
  <path d="M 140 300 
           A 45 45 0 0 1 170 220 
           A 65 65 0 0 1 280 190 
           A 60 60 0 0 1 370 230 
           A 45 45 0 0 1 380 300 
           Z" 
        fill="url(#cloudGrad)" />

  <!-- Weather Text Information -->
  <text x="256" y="445" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="bold" 
        font-size="24px" 
        fill="#e2e8f0" 
        letter-spacing="1">
    CHANCE OF LIGHT RAIN
  </text>

  <text x="256" y="480" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="800" 
        font-size="32px" 
        fill="#63b3ed">
    40%
  </text>
</svg>