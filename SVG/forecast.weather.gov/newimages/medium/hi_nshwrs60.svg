<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions for gradients and clips -->
  <defs>
    <!-- Night Sky Gradient -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1428" />
      <stop offset="100%" stop-color="#203050" />
    </linearGradient>

    <!-- Moon Gradient -->
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe596" />
      <stop offset="100%" stop-color="#ffc338" />
    </linearGradient>

    <!-- Cloud Gradient (Dark/Translucent Night Cloud) -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#576880" />
      <stop offset="100%" stop-color="#303c4d" />
    </linearGradient>

    <!-- Rain Drop Gradient -->
    <linearGradient id="rainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#76a5af" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#4a7c59" stop-opacity="1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="48" fill="url(#nightSky)" />

  <!-- Stars Background -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="100" cy="120" r="2" />
    <circle cx="140" cy="80" r="1.5" />
    <circle cx="380" cy="90" r="2" />
    <circle cx="420" cy="150" r="1.5" />
    <circle cx="280" cy="70" r="2" />
  </g>

  <!-- Weather Icon Group (Centered dynamically) -->
  <g transform="translate(0, -20)">
    <!-- Crescent Moon -->
    <path d="M 285 100 A 70 70 0 1 0 355 170 A 55 55 0 1 1 285 100 Z" 
          fill="url(#moonGrad)" 
          filter="url(#glow)" />

    <!-- Light Rain Animation / Drops (Slanted for realistic look) -->
    <g stroke="url(#rainGrad)" stroke-width="4.5" stroke-linecap="round">
      <line x1="200" y1="290" x2="185" y2="330" />
      <line x1="250" y1="300" x2="235" y2="340" />
      <line x1="300" y1="290" x2="285" y2="330" />
      <line x1="350" y1="295" x2="335" y2="335" />
    </g>

    <!-- Dark Night Cloud Overlaying Moon & Rain -->
    <path d="M 180 280 
             A 45 45 0 0 1 220 200 
             A 65 65 0 0 1 330 190 
             A 50 50 0 0 1 380 250 
             A 40 40 0 0 1 360 300 
             L 180 300 
             A 35 35 0 0 1 180 280 Z" 
          fill="url(#cloudGrad)" />
  </g>

  <!-- Probability & Weather Text -->
  <g text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    <!-- Weather Condition -->
    <text x="256" y="415" font-size="28" font-weight="500" fill="#a0b0cb" letter-spacing="1">LIGHT RAIN</text>
    
    <!-- Probability Indicator -->
    <text x="256" y="460" font-size="38" font-weight="700" fill="#4dabf7">60%</text>
  </g>
</svg>