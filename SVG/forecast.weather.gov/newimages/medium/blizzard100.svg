<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Stormy Blizzard Sky -->
    <linearGradient id="blizzardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050f14" />
      <stop offset="50%" stop-color="#0b1d28" />
      <stop offset="100%" stop-color="#183040" />
    </linearGradient>

    <!-- Linear blur filter to create realistic blowing wind and snow streaks -->
    <filter id="windBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3 1" />
    </filter>

    <!-- Soft glow filter for the green text to make it pop out from the blizzard -->
    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComponentTransfer in="blur" result="glow1">
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="600" height="400" fill="url(#blizzardBg)" />

  <!-- Background Wind Lines / Blowing Mist -->
  <g stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" filter="url(#windBlur)">
    <line x1="-50" y1="50" x2="500" y2="250" />
    <line x1="100" y1="-20" x2="650" y2="200" />
    <line x1="-100" y1="200" x2="450" y2="380" />
    <line x1="200" y1="100" x2="700" y2="300" />
  </g>

  <!-- Far Background Snowflakes (Small, Soft, Fast Angled Deflection) -->
  <g fill="rgba(255, 255, 255, 0.4)" filter="url(#windBlur)">
    <circle cx="50" cy="30" r="1.5" />
    <circle cx="180" cy="70" r="1" />
    <circle cx="290" cy="40" r="2" />
    <circle cx="420" cy="80" r="1.2" />
    <circle cx="560" cy="20" r="1.5" />
    <circle cx="120" cy="150" r="2" />
    <circle cx="230" cy="120" r="1" />
    <circle cx="380" cy="180" r="1.8" />
    <circle cx="490" cy="110" r="1.3" />
    <circle cx="30" cy="280" r="1.6" />
    <circle cx="160" cy="240" r="2.2" />
    <circle cx="320" cy="260" r="1.2" />
    <circle cx="450" cy="220" r="1.5" />
    <circle cx="570" cy="290" r="2" />
    <circle cx="90" cy="360" r="1.2" />
    <circle cx="250" cy="330" r="1.8" />
    <circle cx="400" cy="350" r="1.5" />
    <circle cx="520" cy="380" r="2.1" />
  </g>

  <!-- Mid-ground Blowing Blizzard Slits/Streaks (Heavy Wind Effect) -->
  <g stroke="rgba(255, 255, 255, 0.6)" stroke-width="1.5" stroke-linecap="round" filter="url(#windBlur)">
    <line x1="80" y1="40" x2="160" y2="70" />
    <line x1="340" y1="20" x2="440" y2="60" />
    <line x1="-20" y1="120" x2="70" y2="160" />
    <line x1="220" y1="90" x2="310" y2="130" />
    <line x1="460" y1="140" x2="570" y2="190" />
    <line x1="110" y1="210" x2="200" y2="250" />
    <line x1="290" y1="180" x2="390" y2="220" />
    <line x1="Output" y1="270" x2="120" y2="310" />
    <line x1="380" y1="280" x2="490" y2="330" />
    <line x1="190" y1="320" x2="280" y2="360" />
    <line x1="500" y1="300" x2="610" y2="350" />
  </g>

  <!-- Green Weather Text -->
  <g filter="url(#greenGlow)">
    <text x="50%" y="45%" 
          dominant-baseline="middle" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="54px" 
          font-weight="900" 
          letter-spacing="2px" 
          fill="#10b981">
      BLIZZARD
    </text>
    <text x="50%" y="62%" 
          dominant-baseline="middle" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="20px" 
          font-weight="600" 
          letter-spacing="6px" 
          fill="#34d399">
      WARNING
    </text>
  </g>

  <!-- Foreground Heavy Snow Particles (Closer, Crisp, Drifting Drastically to the Right) -->
  <g fill="rgba(255, 255, 255, 0.85)">
    <!-- Distinct snowflakes passing over and around the text -->
    <circle cx="140" cy="60" r="3" />
    <circle cx="480" cy="45" r="3.5" />
    <circle cx="60" cy="180" r="4" />
    <circle cx="270" cy="130" r="2.5" />
    <circle cx="530" cy="160" r="3.2" />
    <circle cx="210" cy="230" r="4.5" />
    <circle cx="360" cy="200" r="3" />
    <circle cx="110" cy="310" r="3.5" />
    <circle cx="440" cy="290" r="4" />
    <circle cx="580" cy="340" r="2.5" />
    <circle cx="290" cy="370" r="3.8" />
  </g>

  <!-- Drifting Accumulating Snow Drifts at the Bottom -->
  <path d="M 0,400 Q 120,380 280,390 T 600,375 L 600,400 Z" fill="rgba(240, 248, 255, 0.9)" />
  <path d="M 0,400 Q 180,365 380,385 T 600,360 L 600,400 Z" fill="rgba(255, 255, 255, 0.95)" />
</svg>