<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background -->
  <rect width="100" height="100" fill="#e6ccb2" />

  <!-- Sun obscured by dust -->
  <circle cx="50" cy="35" r="12" fill="#ffeacc" opacity="0.6" />

  <!-- Dust Storm Wind Swirls -->
  <g fill="none" stroke="#b08968" stroke-linecap="round" opacity="0.8">
    <!-- Top Swirl -->
    <path d="M 20 40 Q 40 35 60 40 T 90 35" stroke-width="4" />
    <path d="M 25 45 Q 45 42 65 47" stroke-width="2.5" />
    
    <!-- Middle Heavy Swirl -->
    <path d="M 10 55 Q 35 60 55 50 T 85 55" stroke-width="5" />
    <path d="M 40 54 C 45 48, 55 48, 55 54 C 55 60, 42 62, 35 56" stroke-width="3" />
    
    <!-- Bottom Swirls -->
    <path d="M 15 70 Q 50 65 80 72" stroke-width="4.5" />
    <path d="M 30 78 Q 60 82 85 75" stroke-width="3" />
    <path d="M 5 85 Q 45 80 95 85" stroke-width="4" />
  </g>

  <!-- Ground Dust / Shading -->
  <path d="M 0 80 Q 25 75 50 82 T 100 80 L 100 100 L 0 100 Z" fill="#9c6644" opacity="0.5" />
  <path d="M 0 90 Q 35 88 70 93 T 100 90 L 100 100 L 0 100 Z" fill="#7f5539" opacity="0.6" />

  <!-- Airborne Dust Particles -->
  <g fill="#7f5539" opacity="0.7">
    <circle cx="15" cy="25" r="1.5" />
    <circle cx="35" cy="20" r="1" />
    <circle cx="75" cy="22" r="2" />
    <circle cx="85" cy="30" r="1.2" />
    <circle cx="60" cy="65" r="1.8" />
    <circle cx="25" cy="60" r="1.2" />
    <circle cx="45" cy="75" r="2" />
  </g>
</svg>