<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Cloud Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f4f8" />
      <stop offset="50%" stop-color="#d9e2ec" />
      <stop offset="100%" stop-color="#9fb3c8" />
    </linearGradient>

    <!-- Ice/Rain Drop Gradient -->
    <linearGradient id="iceDropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f7fa" />
      <stop offset="100%" stop-color="#00acc1" />
    </linearGradient>

    <!-- Cloud Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#102a43" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- BACKGROUND (Optional, for contrast) -->
  <rect width="100%" height="100%" fill="#1f2937" rx="24" />

  <!-- MAIN WEATHER GROUP -->
  <g transform="translate(0, -20)">
    
    <!-- PRECIPITATION LAYER -->
    <g>
      <!-- Snowflakes (Left & Right) -->
      <!-- Snowflake 1 (Top Left) -->
      <g transform="translate(140, 300) scale(0.75)" stroke="#ffffff" stroke-width="4" stroke-linecap="round">
        <line x1="0" y1="-24" x2="0" y2="24" />
        <line x1="-24" y1="0" x2="24" y2="0" />
        <line x1="-17" y1="-17" x2="17" y2="17" />
        <line x1="-17" y1="17" x2="17" y2="-17" />
        <circle cx="0" cy="0" r="3" fill="#ffffff" stroke="none" />
        <!-- Points -->
        <path d="M-6,-18 L0,-24 L6,-18 M-6,18 L0,24 L6,18 M-18,-6 L-24,0 L-18,6 M18,-6 L24,0 L18,6" fill="none" />
      </g>

      <!-- Snowflake 2 (Bottom Right) -->
      <g transform="translate(360, 360) scale(0.85)" stroke="#ffffff" stroke-width="4" stroke-linecap="round">
        <line x1="0" y1="-24" x2="0" y2="24" />
        <line x1="-24" y1="0" x2="24" y2="0" />
        <line x1="-17" y1="-17" x2="17" y2="17" />
        <line x1="-17" y1="17" x2="17" y2="-17" />
        <circle cx="0" cy="0" r="3" fill="#ffffff" stroke="none" />
        <path d="M-6,-18 L0,-24 L6,-18 M-6,18 L0,24 L6,18 M-18,-6 L-24,0 L-18,6 M18,-6 L24,0 L18,6" fill="none" />
      </g>

      <!-- Freezing Rain / Ice Pellets (Center & Alternating) -->
      <!-- Freezing Rain Drop 1 -->
      <g transform="translate(200, 320) rotate(15)">
        <path d="M0,0 C5,10 10,15 10,22 C10,28 5,32 0,32 C-5,32 -10,28 -10,22 C-10,15 -5,10 0,0 Z" fill="url(#iceDropGrad)" />
        <!-- Ice Glaze/Sparkle Highlight -->
        <path d="M-4,20 C-4,16 -2,12 0,4" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" />
      </g>

      <!-- Freezing Rain Drop 2 -->
      <g transform="translate(290, 300) rotate(15)">
        <path d="M0,0 C5,10 10,15 10,22 C10,28 5,32 0,32 C-5,32 -10,28 -10,22 C-10,15 -5,10 0,0 Z" fill="url(#iceDropGrad)" />
        <path d="M-4,20 C-4,16 -2,12 0,4" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" />
      </g>
      
      <!-- Freezing Rain Drop 3 (Bottom Left) -->
      <g transform="translate(160, 400) rotate(15) scale(0.9)">
        <path d="M0,0 C5,10 10,15 10,22 C10,28 5,32 0,32 C-5,32 -10,28 -10,22 C-10,15 -5,10 0,0 Z" fill="url(#iceDropGrad)" />
        <path d="M-4,20 C-4,16 -2,12 0,4" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" />
      </g>

      <!-- Sleeting / Frozen Nugget (Center Ground/Air) -->
      <g transform="translate(260, 410) scale(0.65)" stroke="#ffffff" stroke-width="4" stroke-linecap="round">
        <line x1="0" y1="-24" x2="0" y2="24" />
        <line x1="-24" y1="0" x2="24" y2="0" />
        <line x1="-17" y1="-17" x2="17" y2="17" />
        <line x1="-17" y1="17" x2="17" y2="-17" />
        <circle cx="0" cy="0" r="3" fill="#ffffff" stroke="none" />
      </g>
    </g>

    <!-- CLOUD SYSTEM LAYER -->
    <!-- Back Cloud (Darker) -->
    <path d="M200,180 
             A45,45 0 0,1 270,160 
             A60,60 0 0,1 370,200 
             A45,45 0 0,1 350,280 
             L180,280 
             A40,40 0 0,1 200,180 Z" 
          fill="#7b93a4" opacity="0.7" />

    <!-- Front Main Cloud -->
    <path d="M140,290 
             A50,50 0 0,1 170,195 
             A75,75 0 0,1 310,175 
             A65,65 0 0,1 410,245 
             A55,55 0 0,1 380,330 
             L140,330 
             A45,45 0 0,1 140,290 Z" 
          fill="url(#cloudGrad)" 
          filter="url(#shadow)" />
  </g>
</svg>