<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1c29" />
      <stop offset="100%" stop-color="#2a3149" />
    </linearGradient>

    <!-- Cloud Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8fa0b5" />
      <stop offset="100%" stop-color="#505f73" />
    </linearGradient>

    <!-- Ice/Rain Drop Gradient -->
    <linearGradient id="rainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Progress Ring Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="300" rx="16" fill="url(#bgGrad)" />

  <!-- 70% Precipitation Radial Gauge -->
  <g transform="translate(75, 120)">
    <!-- Background Circle -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#2d3548" stroke-width="8" />
    <!-- 70% Active Arc (2 * PI * 45 = 282.74 -> 70% is ~198) -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="url(#rainGrad)" stroke-width="8" 
            stroke-dasharray="198 283" stroke-linecap="round" transform="rotate(-90)" filter="url(#glow)" />
    <!-- Percentage Text -->
    <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">70%</text>
    <text x="0" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">PRECIP</text>
  </g>

  <!-- Weather Icon Graphics (Cloud, Snow, Freezing Rain) -->
  <g transform="translate(230, 65)">
    <!-- Snowflakes (Occasional / Scattered) -->
    <!-- Snowflake 1 -->
    <g transform="translate(20, 65) scale(0.75)" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="-12" x2="0" y2="12" />
      <line x1="-12" y1="0" x2="12" y2="0" />
      <line x1="-8" y1="-8" x2="8" y2="8" />
      <line x1="-8" y1="8" x2="8" y2="-8" />
    </g>
    <!-- Snowflake 2 -->
    <g transform="translate(75, 70) scale(0.6)" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="-12" x2="0" y2="12" />
      <line x1="-12" y1="0" x2="12" y2="0" />
      <line x1="-8" y1="-8" x2="8" y2="8" />
      <line x1="-8" y1="8" x2="8" y2="-8" />
    </g>

    <!-- Freezing Rain Drops (Angled, sleek drops with ice highlights) -->
    <g transform="translate(40, 70) rotate(15)">
      <path d="M0,0 C2,4 4,8 4,12 C4,15 2,17 0,17 C-2,17 -4,15 -4,12 C-4,8 -2,4 0,0 Z" fill="url(#rainGrad)" />
    </g>
    <g transform="translate(10, 85) rotate(15) scale(0.8)">
      <path d="M0,0 C2,4 4,8 4,12 C4,15 2,17 0,17 C-2,17 -4,15 -4,12 C-4,8 -2,4 0,0 Z" fill="url(#rainGrad)" />
    </g>
    <g transform="translate(55, 88) rotate(15) scale(0.9)">
      <path d="M0,0 C2,4 4,8 4,12 C4,15 2,17 0,17 C-2,17 -4,15 -4,12 C-4,8 -2,4 0,0 Z" fill="url(#rainGrad)" />
    </g>

    <!-- Heavy/Dark Weather Cloud overlay -->
    <path d="M20,45 A20,20 0 0,1 50,20 A25,25 0 0,1 95,25 A22,22 0 0,1 110,45 A18,18 0 0,1 100,75 L25,75 A18,18 0 0,1 20,45 Z" fill="url(#cloudGrad)" />
  </g>

  <!-- Typography / Labels -->
  <!-- Primary Condition Header -->
  <text x="30" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Freezing Rain &amp; Snow</text>
  
  <!-- Secondary Status Badge -->
  <g transform="translate(30, 242)">
    <rect width="85" height="20" rx="6" fill="#3b4256" />
    <text x="42.5" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#a5f3fc" text-anchor="middle" letter-spacing="0.5">OCCASIONAL</text>
  </g>
</svg>
