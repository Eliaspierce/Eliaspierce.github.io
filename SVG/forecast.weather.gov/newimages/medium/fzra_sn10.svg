<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1c29" />
      <stop offset="100%" stop-color="#2a2e45" />
    </linearGradient>

    <!-- Text Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Icon Gradients -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#axcfeb" stop-opacity="0.8" />
    </linearGradient>
    
    <linearGradient id="iceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="100%" stop-color="#00bae2" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="500" height="200" rx="20" fill="url(#bgGrad)" stroke="#3f4768" stroke-width="1.5" />

  <!-- WEATHER ICON COMPONENT -->
  <g transform="translate(10, 0)">
    <!-- Cloud Layer Back -->
    <path d="M72,110 a22,22 0 0,1 28,-15 a32,32 0 0,1 60,7 a26,26 0 0,1 12,51 l-100,0 a22,22 0 0,1 0,-43 z" fill="url(#cloudGrad)" />
    
    <!-- Freezing Rain / Ice Pellets (Left Side) -->
    <g stroke="url(#iceGrad)" stroke-width="3" stroke-linecap="round">
      <!-- Rain drop falling -->
      <line x1="85" y1="165" x2="80" y2="180" />
      <line x1="105" y1="165" x2="100" y2="180" />
      <!-- Ice glint / frozen dot -->
      <circle cx="80" cy="183" r="2" fill="#a5f3fc" stroke="none" />
      <circle cx="100" cy="183" r="2" fill="#a5f3fc" stroke="none" />
    </g>

    <!-- Snowflakes (Right Side) -->
    <g stroke="#e2f1ff" stroke-width="2.5" stroke-linecap="round" transform="translate(125, 163)">
      <!-- Snowflake 1 -->
      <g>
        <line x1="0" y1="-10" x2="0" y2="10" />
        <line x1="-8.6" y1="-5" x2="8.6" y2="5" />
        <line x1="-8.6" y1="5" x2="8.6" y2="-5" />
      </g>
      <!-- Snowflake 2 -->
      <g transform="translate(22, 10) scale(0.7)">
        <line x1="0" y1="-10" x2="0" y2="10" />
        <line x1="-8.6" y1="-5" x2="8.6" y2="5" />
        <line x1="-8.6" y1="5" x2="8.6" y2="-5" />
      </g>
    </g>
  </g>

  <!-- WEATHER TEXT INFORMATION -->
  <!-- Main Condition Title -->
  <text x="240" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff" letter-spacing="0.5">
    Freezing Rain &amp; Snow
  </text>

  <!-- Precipitation Probability -->
  <g transform="translate(240, 105)">
    <!-- Drop Icon -->
    <path d="M0,13 C0,13 6,7 6,4 A6,6 0 0,0 -6,4 C-6,7 0,13 0,13 Z" fill="#38bdf8" transform="translate(6, 4) scale(1.1)" />
    
    <!-- Chance of Precip Text -->
    <text x="20" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#94a3b8">
      Chance of Precip: <tspan fill="#38bdf8" font-weight="700">10%</tspan>
    </text>
  </g>

  <!-- Decorative Subtle Alert Border Accent -->
  <path d="M 490,40 L 490,25 C 490,22 488,20 485,20 L 470,20" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.6" />
</svg>