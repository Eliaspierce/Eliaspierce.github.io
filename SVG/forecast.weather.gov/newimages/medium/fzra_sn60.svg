<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2639" />
      <stop offset="100%" stop-color="#111823" />
    </linearGradient>

    <!-- Text Fill Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e2f1ff" />
      <stop offset="100%" stop-color="#b0d7ff" />
    </linearGradient>

    <!-- Accent Gradient for Percent -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3df5ff" />
      <stop offset="100%" stop-color="#00a2ff" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Glow Filter for Data -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="500" height="250" rx="16" fill="url(#bgGrad)" stroke="#2c3e50" stroke-width="1.5"/>

  <!-- Weather Icon (Cloud with Snow/Rain) Placed on the Left -->
  <g transform="translate(65, 95)" filter="url(#dropShadow)">
    <!-- Raindrops -->
    <line x1="-10" y1="45" x2="-15" y2="60" stroke="#00d2ff" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    <line x1="20" y1="45" x2="15" y2="60" stroke="#00d2ff" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    
    <!-- Snowflakes -->
    <g transform="translate(5, 52) scale(0.7)">
      <line x1="0" y1="-12" x2="0" y2="12" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-12" y1="0" x2="12" y2="0" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-8" y1="-8" x2="8" y2="8" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-8" y1="8" x2="8" y2="-8" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Ice/Freezing Sheen on Cloud Base -->
    <path d="M-22,35 Q-25,25 -10,20 Q0,25 10,15 Q25,5 45,15 Q60,15 62,30 Q70,35 65,45 Q50,52 35,45 Q15,55 -10,48 Q-25,50 -22,35 Z" fill="#7190a6" opacity="0.2" />

    <!-- Main Cloud -->
    <path d="M-20,30 Q-25,15 -10,10 Q0,18 10,8 Q25,-5 45,5 Q60,5 60,22 Q70,25 65,38 Q55,45 35,42 Q15,50 -10,42 Q-25,42 -20,30 Z" fill="#e6f2ff" />
  </g>

  <!-- Typography Content -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    
    <!-- Main Condition Title -->
    <text x="160" y="75" font-size="28" font-weight="800" fill="url(#textGrad)" filter="url(#dropShadow)" letter-spacing="0.5">
      Freezing Rain &amp; Snow
    </text>

    <!-- Probability & Metric Layout -->
    <g transform="translate(160, 115)">
      <!-- Percentage Value -->
      <text x="0" y="50" font-size="56" font-weight="900" fill="url(#accentGrad)" filter="url(#glow)">
        60%
      </text>
      
      <!-- Label Meta Block -->
      <g transform="translate(130, 18)">
        <text x="0" y="0" font-size="14" font-weight="700" fill="#a0aec0" letter-spacing="1.5" text-transform="uppercase">
          Likely
        </text>
        <text x="0" y="20" font-size="16" font-weight="500" fill="#e2e8f0">
          of Precipitation
        </text>
      </g>
    </g>

    <!-- Subtle Decorative Status Bar -->
    <rect x="160" y="195" width="280" height="6" rx="3" fill="#1e293b"/>
    <rect x="160" y="195" width="168" height="6" rx="3" fill="url(#accentGrad)" filter="url(#glow)"/>
  </g>
</svg>