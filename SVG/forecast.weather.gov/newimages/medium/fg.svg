<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Linear gradients for realistic lighting -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f2f2f2" />
      <stop offset="100%" stop-color="#b3b3b3" />
    </linearGradient>
    <linearGradient id="fogGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d9d9d9" stop-opacity="0" />
      <stop offset="15%" stop-color="#d9d9d9" stop-opacity="0.8" />
      <stop offset="85%" stop-color="#d9d9d9" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d9d9d9" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background Cloud -->
  <path d="M 32,55 
           A 13,13 0 0,1 42,32 
           A 17,17 0 0,1 70,28 
           A 15,15 0 0,1 82,50 
           A 11,11 0 0,1 77,65 
           L 32,65 Z" 
        fill="url(#cloudGrad)" />

  <!-- Fog Streaks (Ground Mist) -->
  <!-- Top Fog Line -->
  <rect x="15" y="58" width="60" height="4" rx="2" fill="url(#fogGrad)" />
  
  <!-- Middle Fog Line (Longest) -->
  <rect x="10" y="66" width="75" height="4" rx="2" fill="url(#fogGrad)" />
  
  <!-- Bottom Fog Line -->
  <rect x="25" y="74" width="50" height="4" rx="2" fill="url(#fogGrad)" />
</svg>
