<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Night Sky Background Gradient -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050510" />
      <stop offset="50%" stop-color="#0a0a26" />
      <stop offset="100%" stop-color="#1a153a" />
    </linearGradient>

    <!-- Ground Gradient -->
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d0d1a" />
      <stop offset="100%" stop-color="#05050b" />
    </linearGradient>

    <!-- Cloud Base Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14" />
      <stop offset="50%" stop-color="#1c1c2e" />
      <stop offset="100%" stop-color="#0f1124" />
    </linearGradient>

    <!-- Funnel Cloud Core Gradient -->
    <linearGradient id="funnelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#151728" />
      <stop offset="25%" stop-color="#2d3047" />
      <stop offset="50%" stop-color="#414666" />
      <stop offset="75%" stop-color="#2d3047" />
      <stop offset="100%" stop-color="#151728" />
    </linearGradient>

    <!-- Lightning Glow Filter -->
    <filter id="lightningGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cloud Softness Filter -->
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" />
    </filter>
    
    <!-- Debris/Dust Softness Filter -->
    <filter id="debrisBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" />
    </filter>

    <!-- Lightning Internal Illumination -->
    <radialGradient id="lightningFlash" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#a3b8cc" stop-opacity="1" />
      <stop offset="40%" stop-color="#4d5370" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1a153a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#nightSky)" />

  <!-- Stars in the upper sky -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="70" cy="50" r="1" />
    <circle cx="150" cy="80" r="1.5" opacity="0.4" />
    <circle cx="230" cy="40" r="1" />
    <circle cx="320" cy="90" r="1.2" opacity="0.8" />
    <circle cx="450" cy="45" r="1" opacity="0.3" />
    <circle cx="650" cy="60" r="1.5" />
    <circle cx="720" cy="105" r="1" />
    <circle cx="780" cy="40" r="1.2" />
    <circle cx="580" cy="30" r="1" />
  </g>

  <!-- Distant Lightning Flash / Ambient Glow behind clouds -->
  <rect width="800" height="500" fill="url(#lightningFlash)" opacity="0.7" />

  <!-- Background Lightning Bolt -->
  <path d="M 280,100 L 260,180 L 290,230 L 250,310 L 270,350" 
        style="fill:none; stroke:#e6f2ff; stroke-width:3; stroke-linecap:round; stroke-linejoin:round;" 
        filter="url(#lightningGlow)" />
  <path d="M 260,180 L 220,220 L 230,260" 
        style="fill:none; stroke:#b3d1ff; stroke-width:1.5; stroke-linecap:round;" 
        filter="url(#lightningGlow)" />

  <!-- Deep Background Cloud Layer -->
  <g fill="#0e0f1d" filter="url(#blurFilter)">
    <circle cx="150" cy="120" r="140" />
    <circle cx="400" cy="90" r="160" />
    <circle cx="680" cy="130" r="130" />
  </g>

  <!-- Main Storm Cloud Base -->
  <g fill="url(#cloudGrad)">
    <!-- Smooth, heavy cloud deck across the top -->
    <path d="M -100,-50 Q 100,80 300,50 T 700,60 T 900,-50 Z" />
    <path d="M -50,50 Q 150,150 400,100 T 850,80 L 850,-50 L -50,-50 Z" opacity="0.8" />
  </g>

  <!-- Cloud Sculpting / Cumulonimbus Under-hangs -->
  <g filter="url(#blurFilter)" opacity="0.6">
    <ellipse cx="250" cy="130" rx="180" ry="60" fill="#131529" />
    <ellipse cx="550" cy="120" rx="220" ry="70" fill="#181a30" />
    <ellipse cx="380" cy="150" rx="120" ry="40" fill="#222540" />
  </g>

  <!-- The Funnel Cloud (Tornado) -->
  <g id="funnel-cloud">
    <!-- Rotational Outer Sheath / Wind Blur -->
    <path d="M 320,130 Q 340,280 435,460 Q 440,470 445,460 Q 490,280 460,130 Z" 
          fill="#232742" filter="url(#debrisBlur)" opacity="0.4" />
    
    <!-- Main Funnel Body -->
    <path d="M 340,130 
             Q 355,220 395,320 
             Q 420,380 438,450 
             L 442,450 
             Q 455,380 465,320 
             Q 480,220 450,130 Z" 
          fill="url(#funnelGrad)" />

    <!-- Internal Condensation Funnel / Core Highlights -->
    <path d="M 375,130 Q 385,220 415,320 Q 430,370 440,440 Q 445,370 448,320 Q 455,220 425,130 Z" 
          fill="#4c5275" opacity="0.3" filter="url(#blurFilter)" />
    
    <!-- Rotational Striations / Wind Bands -->
    <path d="M 350,180 Q 400,210 446,180" fill="none" stroke="#565d85" stroke-width="3" opacity="0.4" />
    <path d="M 368,240 Q 410,265 456,240" fill="none" stroke="#565d85" stroke-width="4" opacity="0.3" />
    <path d="M 388,300 Q 415,320 452,300" fill="none" stroke="#464d70" stroke-width="3" opacity="0.5" />
    <path d="M 405,360 Q 425,375 446,360" fill="none" stroke="#3d4361" stroke-width="3" opacity="0.6" />
    <path d="M 422,410 Q 435,420 444,410" fill="none" stroke="#565d85" stroke-width="2" opacity="0.4" />
  </g>

  <!-- Ground Cascade / Debris Cloud at the base -->
  <!-- Since it's a funnel cloud (not fully structural tornado touchdown yet), the debris is stylized as a rising dust/condensation ring just lifting off the valley -->
  <g fill="#191b2b" filter="url(#debrisBlur)" opacity="0.7">
    <ellipse cx="440" cy="465" rx="50" ry="20" />
    <ellipse cx="435" cy="460" rx="35" ry="12" fill="#2d314ade" />
    <path d="M 380,470 Q 410,430 440,455 Q 470,435 490,470 Z" />
  </g>

  <!-- Foreground Lightning Bolt (Illuminating the edge of the funnel) -->
  <path d="M 450,110 L 480,160 L 460,200 L 510,270 L 485,320 L 530,390 L 500,480" 
        style="fill:none; stroke:#ffffff; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round;" 
        filter="url(#lightningGlow)" />
  
  <!-- Lightning Branching -->
  <path d="M 510,270 L 540,310 L 530,340" 
        style="fill:none; stroke:#e6f2ff; stroke-width:1.5; stroke-linecap:round;" 
        filter="url(#lightningGlow)" opacity="0.8" />

  <!-- Horizon Silhouettes (Distant Trees and Hills) -->
  <path d="M -10,490 
           Q 120,475 250,485 
           T 500,480 
           Q 650,465 810,485 
           L 810,520 L -10,520 Z" 
        fill="#070812" />
  
  <!-- Jagged Tree Line Silhouette details -->
  <path d="M 30,485 L 35,478 L 40,485 L 48,475 L 55,486 L 70,482 L 75,473 L 82,484 
           L 180,480 L 185,474 L 192,481 L 210,478 L 215,470 L 222,479 
           L 560,478 L 568,468 L 575,477 L 590,475 L 600,481 
           L 740,482 L 748,472 L 755,483 Z" 
        fill="#04050d" />

  <!-- Foreground Ground Plane -->
  <rect x="0" y="495" width="800" height="115" fill="url(#groundGrad)" />

  <!-- Subtle highlights on the ground from the lightning -->
  <ellipse cx="480" cy="505" rx="120" ry="8" fill="#4d5370" filter="url(#debrisBlur)" opacity="0.4" />
</svg>