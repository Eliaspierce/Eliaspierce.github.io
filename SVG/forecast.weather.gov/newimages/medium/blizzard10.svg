<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Definitions for gradients and filters -->
  <defs>
    <!-- Background Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Cloud Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Text Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="30" fill="url(#skyGrad)" />

  <!-- Background Wind Swirls / Blizzard Lines -->
  <g fill="none" stroke="#e2e8f0" stroke-linecap="round" opacity="0.2" stroke-dasharray="10 15">
    <path d="M -20,120 Q 100,90 220,130 T 420,100" stroke-width="4" />
    <path d="M -20,180 Q 80,210 200,160 T 420,190" stroke-width="3" />
    <path d="M -20,240 Q 120,220 240,260 T 420,220" stroke-width="5" />
  </g>

  <!-- Heavy Blizzard Snowflakes (Wind-blown angle) -->
  <g fill="#ffffff" opacity="0.85">
    <!-- Small flakes -->
    <circle cx="50" cy="80" r="2" />
    <circle cx="120" cy="60" r="1.5" />
    <circle cx="280" cy="70" r="2.5" />
    <circle cx="350" cy="90" r="2" />
    <circle cx="80" cy="140" r="1.5" />
    <circle cx="320" cy="150" r="2" />
    <circle cx="160" cy="220" r="2.5" />
    <circle cx="240" cy="250" r="1.5" />
    
    <!-- Medium streaks simulating fast moving snow -->
    <line x1="90" y1="110" x2="60" y2="130" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <line x1="220" y1="80" x2="190" y2="100" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <line x1="310" y1="110" x2="280" y2="130" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <line x1="40" y1="190" x2="10" y2="210" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <line x1="150" y1="170" x2="120" y2="190" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <line x1="370" y1="180" x2="340" y2="200" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <line x1="110" y1="260" x2="80" y2="280" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <line x1="270" y1="240" x2="240" y2="260" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Heavy Weather Clouds -->
  <g fill="url(#cloudGrad)">
    <!-- Main back cloud -->
    <path d="M 80,150 
             A 45,45 0 0,1 150,110 
             A 55,55 0 0,1 250,100 
             A 50,50 0 0,1 320,140 
             A 40,40 0 0,1 300,200 
             L 100,200 
             A 35,35 0 0,1 80,150 Z" opacity="0.9" />
    
    <!-- Forefront dark storm cloud -->
    <path d="M 50,170 
             A 40,40 0 0,1 110,130 
             A 50,50 0 0,1 200,120 
             A 45,45 0 0,1 270,150 
             A 35,35 0 0,1 250,210 
             L 70,210 
             A 30,30 0 0,1 50,170 Z" />
  </g>

  <!-- Foreground Intense Blizzard Flakes (overlapping clouds) -->
  <g fill="#ffffff">
    <line x1="180" y1="150" x2="140" y2="175" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <line x1="260" y1="160" x2="220" y2="185" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
    <line x1="100" y1="165" x2="60" y2="190" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <circle cx="130" cy="140" r="4" fill="#e2e8f0" />
    <circle cx="220" cy="135" r="5" fill="#f8fafc" />
  </g>

  <!-- Typography Block -->
  <!-- "BLIZZARD" Text Header -->
  <text x="200" y="310" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="28" 
        font-weight="900" 
        letter-spacing="4" 
        fill="#ffffff" 
        text-anchor="middle" 
        filter="url(#glow)">
    BLIZZARD
  </text>

  <!-- "10% CHANCE OF SNOW" Subtext -->
  <text x="200" y="345" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="16" 
        font-weight="600" 
        letter-spacing="1" 
        fill="#93c5fd" 
        text-anchor="middle">
    10% CHANCE OF SNOW
  </text>
</svg>
