<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Night Vibe -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="100%" stop-color="#101f42" />
    </linearGradient>

    <!-- Moon Glow & Color -->
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe57f" />
      <stop offset="100%" stop-color="#ffb300" />
    </linearGradient>

    <!-- Cloud Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#757575" />
      <stop offset="100%" stop-color="#424242" />
    </linearGradient>

    <!-- Rain Drop Gradient -->
    <linearGradient id="rainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0288d1" stop-opacity="0.4" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="400" height="400" rx="30" fill="url(#nightSky)" />

  <!-- Stars Background -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="80" cy="90" r="1.5" />
    <circle cx="320" cy="80" r="2" />
    <circle cx="340" cy="160" r="1" />
    <circle cx="70" cy="220" r="1.8" />
    <circle cx="180" cy="50" r="1.2" />
  </g>

  <!-- Crescent Moon -->
  <path d="M 230,70 A 55,55 0 1,0 285,125 A 40,40 0 1,1 230,70 Z" 
        fill="url(#moonGrad)" 
        filter="url(#glow)" />

  <!-- Light Rain Drops (Slanted for realistic fall) -->
  <g stroke="url(#rainGrad)" stroke-width="4" stroke-linecap="round">
    <!-- Drop 1 -->
    <line x1="150" y1="210" x2="140" y2="240" />
    <!-- Drop 2 -->
    <line x1="190" y1="220" x2="180" y2="250" />
    <!-- Drop 3 -->
    <line x1="230" y1="210" x2="220" y2="240" />
    <!-- Drop 4 -->
    <line x1="270" y1="215" x2="260" y2="245" />
  </g>

  <!-- Weather Cloud overlaying the moon -->
  <path d="M 140,190 
           A 35,35 0 0,1 160,123 
           A 45,45 0 0,1 235,115 
           A 40,40 0 0,1 285,155 
           A 35,35 0 0,1 270,200 
           Z" 
        fill="url(#cloudGrad)" />

  <!-- Weather Probability Text Overlay -->
  <text x="200" y="320" 
        text-anchor="middle" 
        font-family="Segoe UI, San Francisco, Roboto, sans-serif" 
        font-size="28" 
        font-weight="600" 
        fill="#ffffff" 
        letter-spacing="1">
    Rain 90%
  </text>
</svg>