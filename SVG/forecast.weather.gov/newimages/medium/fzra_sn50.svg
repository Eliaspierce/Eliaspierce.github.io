<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2a6c" />
      <stop offset="50%" stop-color="#275d8c" />
      <stop offset="100%" stop-color="#4d86b3" />
    </linearGradient>

    <!-- Ice/Freezing Glow Effect -->
    <filter id="iceGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComponentTransfer in="blur" result="glow1">
        <feFuncA type="linear" slope="0.8" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Text Gradients -->
    <linearGradient id="iceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f7fa" />
      <stop offset="40%" stop-color="#80deea" />
      <stop offset="100%" stop-color="#00acc1" />
    </linearGradient>

    <linearGradient id="snowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0e0e0" />
      <stop offset="100%" stop-color="#b0bec5" />
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb300" />
      <stop offset="100%" stop-color="#ff6f00" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="500" height="200" rx="15" fill="url(#bgGrad)" />

  <!-- Decorative Weather Elements (Snowflakes & Rain) -->
  <g opacity="0.25">
    <!-- Snowflakes -->
    <text x="40" y="50" font-size="24" fill="#fff">❄</text>
    <text x="420" y="60" font-size="32" fill="#fff">❄</text>
    <text x="460" y="150" font-size="20" fill="#fff">❄</text>
    <text x="30" y="160" font-size="28" fill="#fff">❄</text>
    
    <!-- Rain Drops -->
    <line x1="120" y1="20" x2="110" y2="40" stroke="#80deea" stroke-width="2" stroke-linecap="round" />
    <line x1="220" y1="15" x2="210" y2="35" stroke="#80deea" stroke-width="2" stroke-linecap="round" />
    <line x1="340" y1="25" x2="330" y2="45" stroke="#80deea" stroke-width="2" stroke-linecap="round" />
    <line x1="380" y1="140" x2="370" y2="160" stroke="#80deea" stroke-width="2" stroke-linecap="round" />
    <line x1="100" y1="130" x2="90" y2="150" stroke="#80deea" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Main Text Layout -->
  <g text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    
    <!-- Primary Heading: Freezing Rain & Snow -->
    <text x="250" y="85" font-weight="900" font-size="38" letter-spacing="1">
      <tspan fill="url(#iceGrad)" filter="url(#iceGlow)">FREEZING RAIN</tspan>
      <tspan fill="#ffffff" font-weight="500"> &amp; </tspan>
      <tspan fill="url(#snowGrad)">SNOW</tspan>
    </text>

    <!-- Subheading: Likely Halfway -->
    <text x="250" y="135" font-weight="700" font-size="22" fill="url(#subGrad)" letter-spacing="4">
      LIKELY HALFWAY
    </text>
    
  </g>
  
  <!-- Subtle Ice Border Frame -->
  <rect x="10" y="10" width="480" height="180" rx="12" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.15" />
</svg>