<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Dark, stormy winter sky) -->
    <linearGradient id="blizzardSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Text Gradient (Ice/Snow effect) -->
    <linearGradient id="iceText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Soft Glow Filter for Text and Background Snow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Blur Filter for Fast/Heavy Blizzard Snow Streaks -->
    <filter id="motionBlur">
      <feGaussianBlur stdDeviation="3 1" />
    </filter>
  </defs>

  <!-- 1. Background Sky -->
  <rect width="800" height="600" fill="url(#blizzardSky)" />

  <!-- 2. Distant Heavy Snow Fog / Wind Swirls (Layer 1) -->
  <g fill="#ffffff" opacity="0.15" filter="url(#glow)">
    <circle cx="100" cy="80" r="40" />
    <circle cx="350" cy="120" r="60" />
    <circle cx="700" cy="90" r="50" />
    <path d="M -50 200 Q 200 150 450 250 T 850 200 L 850 350 L -50 350 Z" opacity="0.2" fill="#cbd5e1" filter="url(#glow)"/>
  </g>

  <!-- 3. Fine Background Snow (Layer 2) -->
  <g fill="#ffffff" opacity="0.4">
    <circle cx="50" cy="50" r="1.5" />
    <circle cx="120" cy="180" r="2" />
    <circle cx="200" cy="100" r="1" />
    <circle cx="280" cy="220" r="2.5" />
    <circle cx="390" cy="70" r="1.5" />
    <circle cx="450" cy="190" r="2" />
    <circle cx="530" cy="110" r="1" />
    <circle cx="620" cy="250" r="2.5" />
    <circle cx="710" cy="80" r="2" />
    <circle cx="780" cy="210" r="1.5" />
    <!-- Lower canvas distribution -->
    <circle cx="80" cy="350" r="2" />
    <circle cx="160" cy="480" r="1.5" />
    <circle cx="240" cy="400" r="2.5" />
    <circle cx="320" cy="520" r="1" />
    <circle cx="480" cy="380" r="2" />
    <circle cx="580" cy="490" r="1.5" />
    <circle cx="660" cy="420" r="2.5" />
    <circle cx="740" cy="530" r="2" />
  </g>

  <!-- 4. Blown/Wind-Swept Snow Streaks (Layer 3 - Heavy Blizzard Direction) -->
  <!-- Angled lines simulating 80% heavy whiteout conditions -->
  <g stroke="#ffffff" stroke-linecap="round" opacity="0.5" filter="url(#motionBlur)">
    <!-- Diagonal fast-moving flakes (Top-Left to Bottom-Right style wind) -->
    <line x1="20" y1="10" x2="70" y2="40" stroke-width="2" />
    <line x1="150" y1="30" x2="210" y2="70" stroke-width="3" />
    <line x1="300" y1="20" x2="350" y2="50" stroke-width="1.5" />
    <line x1="450" y1="40" x2="520" y2="80" stroke-width="3.5" />
    <line x1="600" y1="15" x2="660" y2="55" stroke-width="2" />
    <line x1="720" y1="30" x2="790" y2="70" stroke-width="2.5" />

    <line x1="80" y1="150" x2="140" y2="190" stroke-width="3" />
    <line x1="230" y1="120" x2="290" y2="160" stroke-width="2" />
    <line x1="400" y1="160" x2="470" y2="200" stroke-width="4" />
    <line x1="550" y1="130" x2="610" y2="170" stroke-width="1.5" />
    <line x1="680" y1="180" x2="750" y2="220" stroke-width="3" />

    <line x1="40" y1="280" x2="100" y2="320" stroke-width="2.5" />
    <line x1="180" y1="300" x2="250" y2="350" stroke-width="3.5" />
    <line x1="330" y1="270" x2="390" y2="310" stroke-width="2" />
    <line x1="500" y1="290" x2="570" y2="340" stroke-width="4" />
    <line x1="630" y1="310" x2="690" y2="350" stroke-width="2.5" />
    <line x1="760" y1="280" x2="820" y2="320" stroke-width="3" />

    <line x1="10" y1="420" x2="60" y2="450" stroke-width="1.5" />
    <line x1="120" y1="450" x2="190" y2="500" stroke-width="3.5" />
    <line x1="280" y1="410" x2="340" y2="450" stroke-width="2" />
    <line x1="420" y1="460" x2="490" y2="510" stroke-width="4" />
    <line x1="590" y1="430" x2="650" y2="470" stroke-width="2.5" />
    <line x1="700" y1="460" x2="770" y2="510" stroke-width="3" />
  </g>

  <!-- 5. Weather Text Core Layout -->
  <g text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    <!-- Big Bold Weather Status -->
    <text x="400" y="260" font-size="76" font-weight="900" fill="url(#iceText)" letter-spacing="4" filter="url(#glow)">
      BLIZZARD
    </text>
    
    <!-- 80% Snow Indicator Subtext -->
    <text x="400" y="340" font-size="32" font-weight="700" fill="#e2e8f0" letter-spacing="2" opacity="0.9">
      80% SNOW
    </text>

    <!-- Clean contextual data label -->
    <text x="400" y="385" font-size="16" font-weight="500" fill="#94a3b8" letter-spacing="6" opacity="0.8">
      SEVERE WEATHER WARNING
    </text>
  </g>

  <!-- 6. Foreground Heavy/Large Snowflakes (Layer 4 - Passes in front of text) -->
  <g fill="#ffffff" opacity="0.85">
    <!-- Large structural flakes mixed with blurry close-ups -->
    <circle cx="130" cy="240" r="5" filter="url(#glow)" />
    <circle cx="280" cy="380" r="4" />
    <circle cx="360" cy="210" r="6" filter="url(#glow)" />
    <circle cx="480" cy="290" r="4.5" />
    <circle cx="650" cy="220" r="5.5" filter="url(#glow)" />
    <circle cx="220" cy="490" r="5" />
    <circle cx="580" cy="100" r="6" />
  </g>

  <!-- Final dynamic wind-drift accent lines over the entire canvas layout -->
  <path d="M 0 100 L 800 250 M 0 350 L 800 480" stroke="#ffffff" stroke-width="1" opacity="0.15" stroke-dasharray="100 40" />
</svg>
