<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Night -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1445" />
      <stop offset="100%" stop-color="#1a2560" />
    </linearGradient>

    <!-- Moon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Cloud Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a5568" />
      <stop offset="100%" stop-color="#2d3748" />
    </linearGradient>

    <!-- Rain Drop Gradient -->
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#63b3ed" />
      <stop offset="100%" stop-color="#3182ce" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" rx="32" fill="url(#nightSky)" />

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="80" cy="100" r="2" />
    <circle cx="420" cy="80" r="1.5" />
    <circle cx="450" cy="180" r="2" />
    <circle cx="120" cy="220" r="1" />
    <circle cx="250" cy="60" r="2.5" />
  </g>

  <!-- Crescent Moon with Glow -->
  <path d="M 280,70 A 75,75 0 1,0 385,160 A 60,60 0 1,1 280,70 Z" 
        fill="#f6e05e" 
        filter="url(#glow)" 
        opacity="0.9" />

  <!-- Heavy/High Probability Rain Showers (Dense Rain Layer) -->
  <g stroke="url(#dropGrad)" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <!-- Row 1 -->
    <line x1="160" y1="290" x2="145" y2="330" />
    <line x1="210" y1="290" x2="195" y2="330" />
    <line x1="260" y1="290" x2="245" y2="330" />
    <line x1="310" y1="290" x2="295" y2="330" />
    <line x1="360" y1="290" x2="345" y2="330" />
    
    <!-- Row 2 -->
    <line x1="135" y1="340" x2="120" y2="380" />
    <line x1="185" y1="340" x2="170" y2="380" />
    <line x1="235" y1="340" x2="220" y2="380" />
    <line x1="285" y1="340" x2="270" y2="380" />
    <line x1="335" y1="340" x2="320" y2="380" />
    <line x1="385" y1="340" x2="370" y2="380" />
  </g>

  <!-- Rain Drops Splash / Ground Elements -->
  <g fill="#63b3ed" opacity="0.5">
    <ellipse cx="145" cy="400" rx="6" ry="1" />
    <ellipse cx="215" cy="410" rx="8" ry="1.5" />
    <ellipse cx="285" cy="405" rx="7" ry="1" />
    <ellipse cx="355" cy="415" rx="6" ry="1" />
  </g>

  <!-- Dark Storm Cloud Overlaying the Moon -->
  <path d="M 140,280 
           A 45,45 0 0,1 170,200 
           A 65,65 0 0,1 280,170 
           A 55,55 0 0,1 365,210 
           A 45,45 0 0,1 390,280 
           Z" 
        fill="url(#cloudGrad)" />

  <!-- Weather Text Information -->
  <text x="50%" y="455" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="28px" 
        font-weight="bold" 
        fill="#ffffff" 
        letter-spacing="1">
    SHOWERS NIGHT
  </text>

  <text x="50%" y="485" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="20px" 
        font-weight="600" 
        fill="#a0aec0" 
        letter-spacing="0.5">
    Chances Rain 10%
  </text>
</svg>