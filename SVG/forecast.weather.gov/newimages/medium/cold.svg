<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 150" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#172a45" />
    </linearGradient>

    <!-- Text Glow Filter -->
    <filter id="iceGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComponentTransfer in="blur" result="glow1">
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Snowflake Def -->
    <g id="snowflake" stroke="#64ffda" stroke-width="1.5" stroke-linecap="round" opacity="0.3">
      <line x1="0" y1="-8" x2="0" y2="8" />
      <line x1="-8" y1="0" x2="8" y2="0" />
      <line x1="-5.6" y1="-5.6" x2="5.6" y2="5.6" />
      <line x1="-5.6" y1="5.6" x2="5.6" y2="-5.6" />
      <circle cx="0" cy="0" r="1.5" fill="#0a192f" stroke="#64ffda" stroke-width="1" />
    </g>
  </defs>

  <!-- Background Card -->
  <rect width="450" height="150" rx="15" fill="url(#bgGrad)" stroke="#30b0ff" stroke-width="2" />

  <!-- Decorative Background Snowflakes -->
  <use href="#snowflake" x="40" y="35" transform="scale(1.2)" />
  <use href="#snowflake" x="410" y="115" transform="scale(1.5)" />
  <use href="#snowflake" x="380" y="30" transform="scale(0.8)" />
  <use href="#snowflake" x="50" y="120" transform="scale(0.9)" />

  <!-- Context Label: FREEZING -->
  <text x="50%" y="50" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="16" 
        font-weight="700" 
        letter-spacing="4" 
        fill="#30b0ff" 
        opacity="0.9">
    FREEZING
  </text>

  <!-- Temperature Value: <10°F -->
  <text x="50%" y="115" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="54" 
        font-weight="800" 
        fill="#00e5ff" 
        filter="url(#iceGlow)">
    &lt;10°F
  </text>
</svg>