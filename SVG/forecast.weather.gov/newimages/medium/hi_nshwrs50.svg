<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions for gradients and clips -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Moon Gradient -->
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Cloud Gradients -->
    <linearGradient id="cloudBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4b5563" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>
    
    <linearGradient id="cloudFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9ca3af" />
      <stop offset="100%" stop-color="#374151" />
    </linearGradient>

    <!-- Rain Drop Gradient -->
    <linearGradient id="rainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    
    <!-- Progress Ring Mask (To show exactly 50%) -->
    <mask id="halfRing">
      <rect x="0" y="0" width="512" height="512" fill="white" />
      <!-- Cut off the right half to represent 50% visually if needed, 
           or use stroke-dasharray. We will use stroke-dasharray for precision. -->
    </mask>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" rx="32" fill="url(#bgGrad)" />

  <!-- Stars (Night Sky Environment) -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="80" cy="100" r="2" />
    <circle cx="420" cy="80" r="3" />
    <circle cx="450" cy="180" r="1.5" />
    <circle cx="90" cy="260" r="2.5" />
    <circle cx="260" cy="50" r="2" />
  </g>

  <!-- Moon (Night Element) -->
  <path d="M 190 60 A 70 70 0 1 0 290 140 A 55 55 0 1 1 190 60 Z" fill="url(#moonGrad)" filter="drop-shadow(0px 0px 12px rgba(251, 191, 36, 0.3))" />

  <!-- Back Cloud Layer -->
  <path d="M 220 260 
           a 35 35 0 0 1 60 -10 
           a 45 45 0 0 1 80 10 
           a 35 35 0 0 1 0 70 
           l -140 0 
           a 35 35 0 0 1 0 -70 z" 
        fill="url(#cloudBack)" opacity="0.7" />

  <!-- Rain Drops (Light Rain - Clean & Angled) -->
  <g opacity="0.85">
    <!-- Drop 1 -->
    <path d="M 180 310 c 0 4.4 3.6 8 8 8 s 8 -3.6 8 -8 c 0 -8 -8 -16 -8 -16 s -8 8 -8 16 z" fill="url(#rainGrad)" transform="rotate(-15 188 310)" />
    <!-- Drop 2 -->
    <path d="M 240 330 c 0 4.4 3.6 8 8 8 s 8 -3.6 8 -8 c 0 -8 -8 -16 -8 -16 s -8 8 -8 16 z" fill="url(#rainGrad)" transform="rotate(-15 248 330)" />
    <!-- Drop 3 -->
    <path d="M 300 310 c 0 4.4 3.6 8 8 8 s 8 -3.6 8 -8 c 0 -8 -8 -16 -8 -16 s -8 8 -8 16 z" fill="url(#rainGrad)" transform="rotate(-15 308 310)" />
  </g>

  <!-- Front Main Cloud Layer -->
  <path d="M 160 280 
           a 45 45 0 0 1 80 -20 
           a 55 55 0 0 1 100 10 
           a 45 45 0 0 1 0 90 
           l -180 0 
           a 45 45 0 0 1 0 -80 z" 
        fill="url(#cloudFront)" filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.4))" />

  <!-- Probability Progress Ring (Halfway / 50% Metric) -->
  <g transform="translate(256, 425)">
    <!-- Background Track Ring -->
    <circle r="35" fill="none" stroke="#334155" stroke-width="6" />
    <!-- 50% Active Progress Arc (Circumference = 2 * pi * 35 = ~220. 50% = 110) -->
    <circle r="35" fill="none" stroke="#10b981" stroke-width="6" 
            stroke-dasharray="110 220" 
            transform="rotate(-90)" 
            stroke-linecap="round" />
    <!-- Percentage Text Inside Ring -->
    <text x="0" y="5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#10b981">50%</text>
  </g>

  <!-- Weather Status Text (Likely Rain / High Probability) -->
  <text x="256" y="390" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#f8fafc" letter-spacing="1">
    LIKELY RAIN
  </text>
  
  <text x="256" y="480" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
    HIGH PROBABILITY LIGHT RAIN
  </text>
</svg>