<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Night Sky) -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1445" />
      <stop offset="100%" stop-color="#1d2c5e" />
    </linearGradient>

    <!-- Moon Gradient -->
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe596" />
      <stop offset="100%" stop-color="#ffc338" />
    </linearGradient>

    <!-- Cloud Gradient (Dark/Rainy Night) -->
    <linearGradient id="rainCloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#707b93" />
      <stop offset="100%" stop-color="#3a4454" />
    </linearGradient>

    <!-- Rain Drop Gradient -->
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5c7f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4a90e2" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter for Moon -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" rx="24" fill="url(#nightSky)" />

  <!-- Decorative Stars -->
  <circle cx="80" cy="100" r="1.5" fill="#ffffff" opacity="0.6" />
  <circle cx="420" cy="80" r="2" fill="#ffffff" opacity="0.8" />
  <circle cx="450" cy="180" r="1" fill="#ffffff" opacity="0.4" />
  <circle cx="90" cy="260" r="2" fill="#ffffff" opacity="0.5" />

  <!-- Moon (Crescent) -->
  <path d="M 280 80 A 65 65 0 1 0 375 160 A 55 55 0 1 1 280 80 Z" 
        fill="url(#moonGrad)" 
        filter="url(#glow)" />

  <!-- Rain Drops (High Probability Showers) -->
  <g id="rain-drops">
    <!-- Drop 1 -->
    <path d="M 180 340 C 180 345, 184 349, 187 349 C 190 349, 194 345, 194 340 C 194 332, 187 320, 187 320 C 187 320, 180 332, 180 340 Z" fill="url(#dropGrad)" transform="rotate(-15 187 340)" />
    <!-- Drop 2 -->
    <path d="M 230 360 C 230 365, 234 369, 237 369 C 240 369, 244 365, 244 360 C 244 352, 237 340, 237 340 C 237 340, 230 352, 230 360 Z" fill="url(#dropGrad)" transform="rotate(-15 237 360)" />
    <!-- Drop 3 -->
    <path d="M 280 335 C 280 340, 284 344, 287 344 C 290 344, 294 340, 294 335 C 294 327, 287 315, 287 315 C 287 315, 280 327, 280 335 Z" fill="url(#dropGrad)" transform="rotate(-15 287 335)" />
    <!-- Drop 4 -->
    <path d="M 330 350 C 330 355, 334 359, 337 359 C 340 359, 344 355, 344 350 C 344 342, 337 330, 337 330 C 337 330, 330 342, 330 350 Z" fill="url(#dropGrad)" transform="rotate(-15 337 350)" />
  </g>

  <!-- Heavy Weather Cloud Front -->
  <path d="M 160 300 
           A 35 35 0 0 1 190 240 
           A 50 50 0 0 1 280 210 
           A 45 45 0 0 1 350 240 
           A 35 35 0 0 1 380 300 
           Z" 
        fill="url(#rainCloud)" />

  <!-- Weather Text Information -->
  <text x="50%" y="430" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="28px" 
        font-weight="bold" 
        fill="#ffffff" 
        letter-spacing="1">
    SHOWERS
  </text>
  
  <text x="50%" y="465" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="20px" 
        font-weight="500" 
        fill="#a5c7f7" 
        letter-spacing="0.5">
    Chances Rain 30%
  </text>
</svg>